<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>Shaka Player</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;

  font-family:
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}


/* =========================
   PLAYER
========================= */

#player{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  background:#000;

  touch-action:manipulation;
}

video{
  width:100%;
  height:100%;

  object-fit:contain;

  background:#000;

  will-change:transform;
}


/* =========================
   VIDEO MODES
========================= */

video.mode-fit{
  object-fit:contain;
}

video.mode-fill{
  object-fit:fill;
}

video.mode-zoom{
  object-fit:cover;
}


/* =========================
   LOADING
   ONLY SPINNER
========================= */

#loading{
  position:fixed;
  inset:0;

  z-index:9999;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#050505;
}

.spinner{
  width:40px;
  height:40px;

  border-radius:50%;

  border:4px solid #222;

  border-top-color:#ef4444;

  animation:spin .65s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

#error{

  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:12px;

  padding:25px;

  background:#080808;

  color:#fff;

  text-align:center;

}

#error h2{

  font-size:18px;

  font-weight:600;

}

#error p{

  max-width:600px;

  color:#999;

  font-size:13px;

  line-height:1.6;

  word-break:break-word;

  white-space:pre-line;

}

#retry{

  margin-top:8px;

  padding:10px 22px;

  border:0;

  border-radius:7px;

  background:#ef4444;

  color:#fff;

  font-size:13px;

  cursor:pointer;

}


/* =========================
   SHAKA CONTROL COLORS
========================= */

.shaka-controls-container
.shaka-play-button{

  color:#ef4444!important;

}

.shaka-controls-container
.shaka-mute-button{

  color:#ef4444!important;

}

.shaka-controls-container
.shaka-overflow-menu-button{

  color:#fff!important;

}

.shaka-controls-container
.shaka-fullscreen-button{

  color:#fff!important;

}

.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-played{

  background:#ef4444!important;

}

.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-buffered{

  background:#7f1d1d!important;

}

.shaka-video-container{

  background:#000!important;

}


/* =========================
   FIT BUTTON
========================= */

.sp-fit-btn{

  background:transparent!important;

  border:none!important;

  color:#fff!important;

  cursor:pointer!important;

  padding:0 7px!important;

  margin:0!important;

  height:100%;

  min-width:52px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:5px;

  opacity:.85;

  transition:
    opacity .15s,
    transform .15s;

  -webkit-tap-highlight-color:
    transparent;

}

.sp-fit-btn:hover{

  opacity:1;

}

.sp-fit-btn:active{

  opacity:1;

  transform:scale(.92);

}

.sp-fit-btn:focus-visible{

  outline:
    2px solid #ef4444;

  outline-offset:2px;

  border-radius:5px;

}

.fit-icon{

  width:19px;
  height:19px;

  display:flex;

  align-items:center;
  justify-content:center;

}

.fit-icon svg{

  width:19px;
  height:19px;

  display:block;

}

.fit-ratio{

  color:#fff;

  font-size:10px;

  font-weight:600;

  line-height:1;

  white-space:nowrap;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .sp-fit-btn{

    min-width:45px;

    padding:
      0 5px!important;

    gap:3px;

  }

  .fit-icon,
  .fit-icon svg{

    width:17px;
    height:17px;

  }

  .fit-ratio{

    font-size:9px;

  }

}

</style>

</head>


<body>


<!-- =========================
     LOADING
     ONLY SPINNER
========================= -->

<div id="loading">

  <div class="spinner"></div>

</div>


<!-- =========================
     ERROR
========================= -->

<div id="error">

  <h2>
    Unable to play stream
  </h2>

  <p id="errorText"></p>

  <button id="retry">
    Retry
  </button>

</div>


<!-- =========================
     PLAYER
========================= -->

<div id="player">

  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

</div>


<!-- =========================
     SHAKA PLAYER
========================= -->

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>


<script>

(function(){

"use strict";


/* =========================
   ELEMENTS
========================= */

const video =
  document.getElementById("video");

const playerContainer =
  document.getElementById("player");

const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");

const retryButton =
  document.getElementById("retry");


/* =========================
   VARIABLES
========================= */

let player = null;

let streamURL = null;

let fitIndex = 0;

let reconnecting = false;

let reconnectCount = 0;

let reconnectTimer = null;


/* =========================
   GET URL
========================= */

function getStreamURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const url =
    params.get("url");

  if(!url){

    return null;

  }

  try{

    return decodeURIComponent(url);

  }catch(error){

    return url;

  }

}


/* =========================
   UI
========================= */

function showLoading(){

  loading.style.display =
    "flex";

  errorBox.style.display =
    "none";

}


function hideLoading(){

  loading.style.display =
    "none";

}


function showError(message){

  hideLoading();

  errorText.textContent =
    message;

  errorBox.style.display =
    "flex";

}


function hideError(){

  errorBox.style.display =
    "none";

}


/* =========================
   STREAM TYPE
========================= */

function isM3U8(url){

  return /\.m3u8($|[?#])/i
    .test(url);

}


function isMPD(url){

  return /\.mpd($|[?#])/i
    .test(url);

}


/* =========================
   VIDEO RATIO
========================= */

function getVideoRatio(){

  const w =
    video.videoWidth;

  const h =
    video.videoHeight;

  if(!w || !h){

    return "";

  }

  const r =
    w / h;


  if(
    Math.abs(r - 16/9) < .03
  ){

    return "16:9";

  }


  if(
    Math.abs(r - 4/3) < .03
  ){

    return "4:3";

  }


  if(
    Math.abs(r - 21/9) < .04
  ){

    return "21:9";

  }


  if(
    Math.abs(r - 1) < .03
  ){

    return "1:1";

  }


  return r.toFixed(2)+":1";

}


/* =========================
   FIT / FILL / ZOOM ICONS
========================= */

const FIT_ICONS = {


  fit:`

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">

      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>

      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>

      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>

      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>

    </svg>

  `,


  fill:`

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">

      <rect
        x="5"
        y="5"
        width="14"
        height="14"
        rx="1"/>

      <path d="M9 5v4H5"/>

      <path d="M15 5v4h4"/>

      <path d="M9 19v-4H5"/>

      <path d="M15 19v-4h4"/>

    </svg>

  `,


  zoom:`

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">

      <path d="M8 3H5a2 2 0 0 0-2 2v3"/>

      <path d="M16 3h3a2 2 0 0 1 2 2v3"/>

      <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>

      <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>

      <path d="M8 8 5 5"/>

      <path d="M16 8l3-3"/>

      <path d="m8 16-3 3"/>

      <path d="m16 16 3 3"/>

    </svg>

  `

};


/* =========================
   FIT MODES
========================= */

const FIT_MODES = [

  {
    name:"Fit",
    css:"mode-fit",
    icon:FIT_ICONS.fit
  },

  {
    name:"Fill",
    css:"mode-fill",
    icon:FIT_ICONS.fill
  },

  {
    name:"Zoom",
    css:"mode-zoom",
    icon:FIT_ICONS.zoom
  }

];


/* =========================
   APPLY FIT
========================= */

function applyFit(button){

  const mode =
    FIT_MODES[fitIndex];


  video.classList.remove(

    "mode-fit",
    "mode-fill",
    "mode-zoom"

  );


  video.classList.add(
    mode.css
  );


  const icon =
    button.querySelector(
      ".fit-icon"
    );


  const ratio =
    button.querySelector(
      ".fit-ratio"
    );


  if(icon){

    icon.innerHTML =
      mode.icon;

  }


  if(ratio){

    ratio.textContent =
      getVideoRatio() ||
      "--";

  }


  button.title =
    mode.name;

}


/* =========================
   ADD FIT BUTTON
========================= */

function addFitButton(){

  const panel =
    playerContainer.querySelector(
      ".shaka-controls-button-panel"
    );


  if(!panel){

    return;

  }


  if(
    panel.querySelector(
      ".sp-fit-btn"
    )
  ){

    return;

  }


  const fullscreen =
    panel.querySelector(
      ".shaka-fullscreen-button"
    );


  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "sp-fit-btn";


  button.title =
    "Fit";


  button.innerHTML = `

    <span class="fit-icon">
      ${FIT_ICONS.fit}
    </span>

    <span class="fit-ratio">
      --
    </span>

  `;


  if(fullscreen){

    panel.insertBefore(
      button,
      fullscreen
    );

  }else{

    panel.appendChild(
      button
    );

  }


  button.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      event.stopPropagation();


      fitIndex++;


      if(
        fitIndex >=
        FIT_MODES.length
      ){

        fitIndex = 0;

      }


      applyFit(button);

    }
  );


  function updateRatio(){

    const ratio =
      button.querySelector(
        ".fit-ratio"
      );


    if(ratio){

      ratio.textContent =
        getVideoRatio() ||
        "--";

    }

  }


  video.addEventListener(
    "loadedmetadata",
    updateRatio
  );


  video.addEventListener(
    "resize",
    updateRatio
  );


  applyFit(button);

}


/* =========================
   DESTROY PLAYER
========================= */

async function destroyPlayer(){

  if(player){

    try{

      await player.destroy();

    }catch(error){

      console.warn(
        "Destroy error:",
        error
      );

    }

    player =
      null;

  }


  video.pause();

  video.removeAttribute(
    "src"
  );


  try{

    video.load();

  }catch(error){}

}


/* =========================
   START SHAKA
========================= */

async function startShaka(url){

  showLoading();


  shaka.polyfill.installAll();


  if(
    !shaka.Player.isBrowserSupported()
  ){

    throw new Error(
      "This browser does not support Shaka Player."
    );

  }


  player =
    new shaka.Player();


  await player.attach(
    video
  );


  /* =========================
     SHAKA UI
  ========================= */

  const overlay =
    new shaka.ui.Overlay(

      player,

      playerContainer,

      video

    );


  overlay.configure({

    controlPanelElements:[

      "play_pause",

      "mute",

      "volume",

      "time_and_duration",

      "spacer",

      "fullscreen",

      "overflow_menu"

    ],


    overflowMenuButtons:[

      "quality",

      "picture_in_picture",

      "loop",

      "playback_rate"

    ],


    seekBarColors:{

      base:"#777",

      buffered:"#7f1d1d",

      played:"#ef4444"

    }

  });


  /* =========================
     FIT BUTTON
  ========================= */

  setTimeout(

    function(){

      addFitButton();

    },

    300

  );


  /* =========================
     STREAM CONFIG
     FAST START
     AUTO QUALITY
  ========================= */

  player.configure({

    streaming:{

      /*
       * Faster startup
       */

      lowLatencyMode:true,

      /*
       * Start playback quickly.
       */

      bufferingGoal:4,

      /*
       * Small rebuffer target
       * for faster response.
       */

      rebufferingGoal:1,

      bufferBehind:20,

      safeSeekOffset:2,

      stallEnabled:true,

      stallThreshold:1,


      retryParameters:{

        maxAttempts:5,

        baseDelay:300,

        backoffFactor:1.5,

        fuzzFactor:.3,

        timeout:15000

      }

    },


    manifest:{

      ignoreTextStreamFailures:true,

      retryParameters:{

        maxAttempts:5,

        baseDelay:300,

        backoffFactor:1.5,

        fuzzFactor:.3,

        timeout:15000

      }

    },


    /*
     * AUTO QUALITY
     */

    abr:{

      enabled:true,

      /*
       * Reasonable initial estimate.
       * Shaka will automatically
       * adjust according to network.
       */

      defaultBandwidthEstimate:3000000,

      /*
       * Faster quality switching.
       */

      switchInterval:2,

      /*
       * Prefer safe startup.
       */

      restrictToElementSize:false,

      restrictToScreenSize:false

    }

  });


  /* =========================
     ERROR EVENT
  ========================= */

  player.addEventListener(
    "error",
    function(event){

      console.error(
        "Shaka error:",
        event.detail
      );

    }
  );


  /* =========================
     LOAD
  ========================= */

  await player.load(
    url
  );


  hideLoading();


  /*
   * AUTOPLAY
   */

  video.play().catch(
    function(){

      /*
       * Some browsers block
       * autoplay with sound.
       */

      video.muted = true;

      video.play().catch(
        function(){}
      );

    }
  );

}


/* =========================
   NATIVE HLS
========================= */

async function startNativeHLS(url){

  showLoading();


  video.controls =
    true;


  video.src =
    url;


  return new Promise(

    function(resolve,reject){


      function loaded(){

        hideLoading();


        video.play().catch(

          function(){

            video.muted = true;

            video.play().catch(
              function(){}
            );

          }

        );


        resolve();

      }


      function failed(){

        reject(
          new Error(
            "Native HLS playback failed."
          )
        );

      }


      video.addEventListener(
        "loadedmetadata",
        loaded,
        {once:true}
      );


      video.addEventListener(
        "error",
        failed,
        {once:true}
      );


    }

  );

}


/* =========================
   PLAY STREAM
========================= */

async function playStream(url){

  await destroyPlayer();


  /* =========================
     M3U8
  ========================= */

  if(
    isM3U8(url)
  ){

    try{

      await startShaka(
        url
      );

      return;

    }catch(error){

      console.warn(
        "Shaka HLS failed:",
        error
      );


      await destroyPlayer();


      /*
       * Native HLS fallback
       */

      if(
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ){

        try{

          await startNativeHLS(
            url
          );

          return;

        }catch(nativeError){

          console.warn(
            "Native HLS failed:",
            nativeError
          );

        }

      }


      throw new Error(
        "M3U8 playback failed. " +
        "The stream may require CORS, " +
        "authentication, special headers, " +
        "or may be offline."
      );

    }

  }


  /* =========================
     MPD
  ========================= */

  if(
    isMPD(url)
  ){

    await startShaka(
      url
    );

    return;

  }


  /* =========================
     UNKNOWN FORMAT
  ========================= */

  await startShaka(
    url
  );

}


/* =========================
   AUTO RECONNECT
========================= */

async function reconnect(){

  if(
    reconnecting ||
    !streamURL
  ){

    return;

  }


  if(
    reconnectCount >= 5
  ){

    showError(
      "Stream unavailable after several retries."
    );

    return;

  }


  reconnecting =
    true;

  reconnectCount++;


  showLoading();


  try{

    await playStream(
      streamURL
    );


    reconnectCount =
      0;

    reconnecting =
      false;


  }catch(error){

    console.error(
      "Reconnect failed:",
      error
    );


    reconnecting =
      false;


    reconnectTimer =
      setTimeout(

        function(){

          reconnect();

        },

        Math.min(

          1000 *
          Math.pow(
            2,
            reconnectCount - 1
          ),

          8000

        )

      );

  }

}


/* =========================
   START
========================= */

async function startPlayer(){

  hideError();


  const url =
    getStreamURL();


  if(!url){

    showError(
      "No stream URL was provided.\n\n" +
      "Example:\n" +
      "?url=https://example.com/live/index.m3u8"
    );

    return;

  }


  streamURL =
    url;


  try{

    showLoading();


    await playStream(
      url
    );


    hideLoading();


  }catch(error){

    console.error(
      "Playback error:",
      error
    );


    showError(
      error.message ||
      "Unable to play stream."
    );

  }

}


/* =========================
   VIDEO EVENTS
========================= */

video.addEventListener(
  "playing",
  function(){

    hideLoading();

    reconnectCount =
      0;

  }
);


video.addEventListener(
  "waiting",
  function(){

    showLoading();

  }
);


video.addEventListener(
  "canplay",
  function(){

    if(
      !video.paused
    ){

      hideLoading();

    }

  }
);


video.addEventListener(
  "stalled",
  function(){

    console.log(
      "Stream stalled."
    );

  }
);


video.addEventListener(
  "error",
  function(){

    if(
      streamURL &&
      !reconnecting
    ){

      console.log(
        "Video error detected."
      );

    }

  }
);


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      !document.hidden
    ){

      setTimeout(
        function(){

          if(
            video.paused &&
            streamURL
          ){

            video.play().catch(

              function(){

                video.muted =
                  true;

                video.play().catch(
                  function(){}
                );

              }

            );

          }

        },

        300

      );

    }

  }
);


/* =========================
   RETRY BUTTON
========================= */

retryButton.addEventListener(
  "click",
  function(){

    if(reconnectTimer){

      clearTimeout(
        reconnectTimer
      );

      reconnectTimer =
        null;

    }


    reconnectCount =
      0;

    reconnecting =
      false;


    startPlayer();

  }
);


/* =========================
   NETWORK CHANGE
========================= */

if(
  navigator.connection
){

  navigator.connection.addEventListener(
    "change",
    function(){

      console.log(
        "Network changed."
      );

      /*
       * Let Shaka ABR automatically
       * select the appropriate quality.
       */

    }
  );

}


/* =========================
   INIT
========================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    function(){

      startPlayer();

    }
  );

}else{

  startPlayer();

}


})();

</script>

</body>
</html>
