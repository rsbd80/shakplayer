<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Player with Rotation & Auto Play</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.2/dist/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            background: #000; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }
        #player { 
            width: 100%; 
            max-width: 800px; 
        }
        
        /* রোটেশন স্টাইল */
        .plyr--video.plyr--rotated-90 .plyr__video-wrapper {
            transform: rotate(90deg) scale(1.2);
            width: 100% !important;
            height: 100% !important;
        }
        .plyr--video.plyr--rotated-180 .plyr__video-wrapper {
            transform: rotate(180deg);
        }
        .plyr--video.plyr--rotated-270 .plyr__video-wrapper {
            transform: rotate(270deg) scale(1.2);
        }
        
        /* ফুলস্ক্রিনে রোটেশন অ্যাডজাস্ট - পুরো স্ক্রিন ফিট */
        .plyr--fullscreen.plyr--rotated-90 .plyr__video-wrapper,
        .plyr--fullscreen.plyr--rotated-270 .plyr__video-wrapper {
            transform: rotate(90deg) scale(1.8);
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }
        
        .plyr--fullscreen.plyr--rotated-180 .plyr__video-wrapper {
            transform: rotate(180deg) scale(1.2);
        }
        
        /* ফুলস্ক্রিনে ভিডিও ফিট */
        .plyr--fullscreen .plyr__video-wrapper video {
            object-fit: contain !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* রোটেশন ইনডিকেটর */
        .plyr__control--rotate-indicator {
            position: relative;
            transition: all 0.3s ease;
        }
        .plyr__control--rotate-indicator.active {
            color: #00b3ff !important;
            background: rgba(0, 179, 255, 0.2) !important;
            border-radius: 50%;
        }
        .plyr__control--rotate-indicator.active::after {
            content: '↻';
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 12px;
            color: #00b3ff;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* মোবাইল ফ্রেন্ডলি */
        @media (max-width: 768px) {
            #player { max-width: 100%; }
            .plyr__controls { padding: 10px 5px; }
            .plyr__control { padding: 8px; }
        }
    </style>
</head>
<body>

<video id="player" controls crossorigin playsinline autoplay>
    <source type="application/vnd.apple.mpegurl" src="">
</video>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>

<script>
    // URL থেকে url প্যারামিটারটি নেওয়া
    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('url');
    
    const video = document.getElementById('player');
    const source = video.querySelector('source');
    
    if (videoSrc) {
        source.src = videoSrc;
    }

    document.addEventListener("DOMContentLoaded", () => {
        // Plyr প্লেয়ার ইনিশিয়ালাইজ
        const player = new Plyr(video, {
            autoplay: true,
            controls: [
                'play-large', 'play', 'progress', 'current-time', 'mute', 
                'volume', 'captions', 'settings', 'pip', 'airplay', 
                'fullscreen'
            ]
        });

        let isRotated = false;
        let rotationAngle = 0;

        // HLS সাপোর্ট
        if (Hls.isSupported() && videoSrc) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backbufferLength: 30
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(error) {
                    console.log('Auto-play was prevented:', error);
                });
            });
        }

        // ফুলস্ক্রিন বাটন খুঁজে বের করা
        const fullscreenBtn = document.querySelector('[data-plyr="fullscreen"]');
        
        if (fullscreenBtn) {
            // ফুলস্ক্রিন বাটনে ক্লিক ইভেন্ট ওভাররাইড
            fullscreenBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                
                // রোটেশন টগল
                toggleRotation();
                
                // ফুলস্ক্রিন টগল
                player.fullscreen.toggle();
                
                // অটোপ্লে নিশ্চিত করা
                if (video.paused) {
                    video.play().catch(function(error) {
                        console.log('Play prevented:', error);
                    });
                }
            });
        }

        // রোটেশন টগল ফাংশন
        function toggleRotation() {
            const plyrElement = player.elements.container;
            
            // পুরানো রোটেশন ক্লাস সরান
            plyrElement.classList.remove('plyr--rotated-90', 'plyr--rotated-180', 'plyr--rotated-270');
            
            if (!isRotated) {
                // রোটেট করুন (৯০ ডিগ্রি)
                plyrElement.classList.add('plyr--rotated-90');
                rotationAngle = 90;
                isRotated = true;
                
                // ফুলস্ক্রিনে থাকলে পুরো স্ক্রিন কভার
                if (document.fullscreenElement) {
                    document.documentElement.style.transform = 'rotate(90deg)';
                    document.documentElement.style.width = '100vh';
                    document.documentElement.style.height = '100vw';
                    document.documentElement.style.transformOrigin = 'center center';
                    document.documentElement.style.overflow = 'hidden';
                    
                    // ভিডিও পুরো স্ক্রিন ফিট
                    video.style.objectFit = 'cover';
                    video.style.width = '100%';
                    video.style.height = '100%';
                }
            } else {
                // নরমালে ফিরে যান
                isRotated = false;
                rotationAngle = 0;
                
                // ভিউপোর্ট রিসেট
                document.documentElement.style.transform = '';
                document.documentElement.style.width = '';
                document.documentElement.style.height = '';
                document.documentElement.style.transformOrigin = '';
                document.documentElement.style.overflow = '';
                
                video.style.objectFit = '';
                video.style.width = '';
                video.style.height = '';
            }
            
            // ফুলস্ক্রিন বাটনে ইন্ডিকেটর দেখান
            if (isRotated) {
                fullscreenBtn.classList.add('active');
            } else {
                fullscreenBtn.classList.remove('active');
            }
        }

        // ফুলস্ক্রিন চেঞ্জ ইভেন্ট
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // ফুলস্ক্রিন থেকে বের হলে রিসেট
                document.documentElement.style.transform = '';
                document.documentElement.style.width = '';
                document.documentElement.style.height = '';
                document.documentElement.style.transformOrigin = '';
                document.documentElement.style.overflow = '';
                
                video.style.objectFit = '';
                video.style.width = '';
                video.style.height = '';
                
                // রোটেশন অ্যাক্টিভ থাকলে সেটা রাখুন
                if (isRotated) {
                    const plyrElement = player.elements.container;
                    plyrElement.classList.add('plyr--rotated-90');
                }
            } else if (isRotated) {
                // ফুলস্ক্রিনে রোটেটেড থাকলে পুরো স্ক্রিন কভার
                document.documentElement.style.transform = 'rotate(90deg)';
                document.documentElement.style.width = '100vh';
                document.documentElement.style.height = '100vw';
                document.documentElement.style.transformOrigin = 'center center';
                document.documentElement.style.overflow = 'hidden';
                
                video.style.objectFit = 'cover';
                video.style.width = '100%';
                video.style.height = '100%';
            }
        });

        // অটোপ্লে চেষ্টা
        video.addEventListener('loadedmetadata', function() {
            video.play().catch(function(error) {
                console.log('Auto-play was prevented:', error);
                // ইউজার ইন্টারঅ্যাকশনের জন্য অপেক্ষা
                document.addEventListener('click', function playOnClick() {
                    video.play();
                    document.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        });

        // কিবোর্ড শর্টকাট: F কী প্রেস করলে রোটেট+ফুলস্ক্রিন হবে
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                if (fullscreenBtn) {
                    fullscreenBtn.click();
                }
            }
        });

        console.log('🎬 প্লেয়ার লোড হয়েছে! ফুলস্ক্রিন বাটনে ক্লিক করলে রোটেট + অটোপ্লে হবে।');
    });
</script>

</body>
</html>
