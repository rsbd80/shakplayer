<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Stream Player</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

#player{
  position:fixed;
  inset:0;
  background:#000;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

video.fill{
  object-fit:fill;
}

video.cover{
  object-fit:cover;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
  background:#050505;
  color:#aaa;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid #222;
  border-top-color:#ef4444;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#loadingText{
  font-size:13px;
}

#error{
  position:fixed;
  inset:0;
  z-index:9998;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  padding:25px;
  background:#080808;
  color:#fff;
  text-align:center;
}

#error h2{
  font-size:18px;
}

#error p{
  max-width:600px;
  color:#999;
  font-size:13px;
  line-height:1.6;
  word-break:break-word;
}

#retry{
  margin-top:8px;
  padding:10px 20px;
  border:0;
  border-radius:7px;
  background:#ef4444;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="loading">
  <div class="spinner"></div>
  <div id="loadingText">Loading stream...</div>
</div>

<div id="error">
  <h2>Unable to play stream</h2>
  <p id="errorText"></p>
  <button id="retry">Retry</button>
</div>

<div id="player">
  <video
    id="video"
    playsinline
    webkit-playsinline
    controls
    preload="auto">
  </video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){

"use strict";

const video = document.getElementById("video");
const playerContainer = document.getElementById("player");

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

const errorBox = document.getElementById("error");
const errorText = document.getElementById("errorText");
const retryButton = document.getElementById("retry");

let shakaPlayer = null;
let currentURL = null;
let nativeHLS = false;


/* =========================
   GET URL
========================= */

function getStreamURL(){

  const params = new URLSearchParams(window.location.search);

  let url = params.get("url");

  if(!url){
    return null;
  }

  try{
    return decodeURIComponent(url);
  }catch(e){
    return url;
  }
}


/* =========================
   UI
========================= */

function showLoading(text){

  loadingText.textContent = text || "Loading stream...";
  loading.style.display = "flex";
  errorBox.style.display = "none";

}

function hideLoading(){

  loading.style.display = "none";

}

function showError(message){

  hideLoading();

  errorText.textContent = message;

  errorBox.style.display = "flex";

}

function hideError(){

  errorBox.style.display = "none";

}


/* =========================
   DETECT STREAM TYPE
========================= */

function isM3U8(url){

  return /\.m3u8($|[?#])/i.test(url);

}

function isMPD(url){

  return /\.mpd($|[?#])/i.test(url);

}


/* =========================
   DESTROY PLAYER
========================= */

async function destroyPlayer(){

  try{

    if(shakaPlayer){

      await shakaPlayer.destroy();
      shakaPlayer = null;

    }

  }catch(e){

    console.warn(e);

  }

  video.pause();
  video.removeAttribute("src");

  try{
    video.load();
  }catch(e){}

}


/* =========================
   NATIVE HLS
========================= */

async function playNativeHLS(url){

  nativeHLS = true;

  showLoading("Starting HLS...");

  video.controls = true;

  video.src = url;

  video.addEventListener(
    "loadedmetadata",
    function(){

      hideLoading();

      video.play().catch(function(){});

    },
    {once:true}
  );

  video.addEventListener(
    "error",
    function(){

      if(video.error){

        showError(
          "HLS playback failed. Error code: " +
          video.error.code
        );

      }

    },
    {once:true}
  );

}


/* =========================
   SHAKA PLAYER
========================= */

async function playShaka(url){

  nativeHLS = false;

  showLoading("Starting Shaka Player...");

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){

    throw new Error(
      "This browser does not support Shaka Player."
    );

  }

  shakaPlayer = new shaka.Player();

  await shakaPlayer.attach(video);


  /* -------------------------
     UI
  ------------------------- */

  new shaka.ui.Overlay(
    shakaPlayer,
    playerContainer,
    video
  ).configure({

    controlPanelElements:[
      "play_pause",
      "mute",
      "volume",
      "time_and_duration",
      "spacer",
      "quality",
      "fullscreen",
      "overflow_menu"
    ],

    overflowMenuButtons:[
      "quality",
      "picture_in_picture",
      "loop",
      "playback_rate"
    ],

    seekBarColors:{
      base:"#777",
      buffered:"#7f1d1d",
      played:"#ef4444"
    }

  });


  /* -------------------------
     Configuration
  ------------------------- */

  shakaPlayer.configure({

    streaming:{

      lowLatencyMode:false,

      bufferingGoal:10,

      rebufferingGoal:2,

      bufferBehind:30,

      stallEnabled:true,

      stallThreshold:2,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },

    manifest:{

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      },

      ignoreTextStreamFailures:true

    },

    abr:{

      enabled:true,

      defaultBandwidthEstimate:2000000,

      switchInterval:4

    }

  });


  /* -------------------------
     Errors
  ------------------------- */

  shakaPlayer.addEventListener(
    "error",
    function(event){

      console.error(
        "Shaka error:",
        event.detail
      );

    }
  );


  /* -------------------------
     LOAD
  ------------------------- */

  await shakaPlayer.load(url);

  hideLoading();

  video.play().catch(function(){});

}


/* =========================
   START
========================= */

async function startPlayer(){

  hideError();

  const url = getStreamURL();

  if(!url){

    showError(
      "No stream URL found.\n\n" +
      "Use:\n" +
      "?url=https://example.com/stream.m3u8"
    );

    return;

  }

  currentURL = url;

  console.log(
    "Stream URL:",
    currentURL
  );


  await destroyPlayer();


  /* -------------------------
     M3U8
  ------------------------- */

  if(isM3U8(url)){

    try{

      /*
       * First try Shaka
       */

      await playShaka(url);

      return;

    }catch(shakaError){

      console.warn(
        "Shaka HLS failed:",
        shakaError
      );

      await destroyPlayer();


      /*
       * Native HLS fallback
       */

      if(
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ){

        try{

          await playNativeHLS(url);

          return;

        }catch(nativeError){

          console.error(nativeError);

        }

      }

      showError(
        "M3U8 stream could not be played.\n\n" +
        "The stream may require CORS permission, " +
        "special headers, authentication, or may be offline."
      );

      return;

    }

  }


  /* -------------------------
     MPD
  ------------------------- */

  if(isMPD(url)){

    try{

      await playShaka(url);

      return;

    }catch(error){

      console.error(error);

      showError(
        "MPD/DASH stream could not be played.\n\n" +
        (error.message || "Unknown error")
      );

      return;

    }

  }


  /*
   * Unknown extension:
   * Try Shaka anyway.
   */

  try{

    await playShaka(url);

  }catch(error){

    console.error(error);

    showError(
      "Unable to detect or play this stream.\n\n" +
      (error.message || "Unknown error")
    );

  }

}


/* =========================
   RETRY
========================= */

retryButton.addEventListener(
  "click",
  function(){

    startPlayer();

  }
);


/* =========================
   NETWORK CHANGE
========================= */

if(navigator.connection){

  navigator.connection.addEventListener(
    "change",
    function(){

      console.log(
        "Network changed"
      );

    }
  );

}


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  startPlayer
);

})();
</script>

</body>
      </html>
