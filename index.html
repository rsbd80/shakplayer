<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Full Screen Video with Rotation</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.2/dist/plyr.css" />
    <style>
        /* রিসেট */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* প্লেয়ার কন্টেইনার */
        .plyr--video {
            width: 100vw !important;
            height: 100vh !important;
        }

        /* ভিডিও এলিমেন্ট – রোটেশন ও স্কেলিং হ্যান্ডেল করার জন্য */
        #player {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;   /* ফাঁকা জায়গা না রেখে কভার */
            background: #000;
            /* রোটেশন transform-এ প্রয়োগ হবে (জাভাস্ক্রিপ্টের মাধ্যমে) */
            transition: transform 0.2s ease;
        }

        /* রোটেটেড অবস্থায় প্লেয়ার কন্ট্রোল যেন ঠিক থাকে */
        .plyr__controls {
            z-index: 10;
        }
    </style>
</head>
<body>

    <video id="player" playsinline muted autoplay controls>
        <source type="application/vnd.apple.mpegurl" src="" />
    </video>

    <!-- Plyr এবং HLS.js লাইব্রেরি -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>

    <script>
        (function() {
            'use strict';

            // URL থেকে ভিডিও সোর্স নেওয়া
            const urlParams = new URLSearchParams(window.location.search);
            const videoSrc = urlParams.get('url');
            const video = document.getElementById('player');

            // সোর্স সেট করা
            if (videoSrc) {
                video.querySelector('source').src = videoSrc;
                video.load(); // রিলোড
            }

            // Plyr ইনিশিয়ালাইজ
            let player;
            document.addEventListener('DOMContentLoaded', () => {
                player = new Plyr(video, {
                    fullscreen: { enabled: true, fallback: true, iosNative: true },
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
                });

                // HLS সাপোর্ট
                if (Hls.isSupported() && videoSrc) {
                    const hls = new Hls();
                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);
                    // HLS এর রেডি হলে অটোপ্লে চালু
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => {});
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari native HLS
                    video.src = videoSrc;
                }
            });

            // ---------- রোটেশন হ্যান্ডলিং ----------
            function applyRotation(angle) {
                if (!video) return;
                // ভিডিও এলিমেন্টে transform প্রয়োগ
                // Plyr এর ভিতরের ভিডিওতে transform দিতে হবে, কারণ Plyr ভিডিওকে ওভারলে করে
                // আমরা সরাসরি #player এ দিচ্ছি – Plyr তা মানিয়ে নেয়
                video.style.transform = `rotate(${angle}deg) scale(1.0)`;
                // অতিরিক্ত: ভিডিও কভার করার জন্য object-fit ঠিক রাখা
                video.style.objectFit = 'cover';
            }

            // ডিভাইস ওরিয়েন্টেশন চেক করে অ্যাঙ্গেল বের করা
            function getOrientationAngle() {
                const orient = window.orientation; // ডিগ্রিতে: 0, 90, -90, 180 (Safari)
                if (orient !== undefined && orient !== null) {
                    return orient; // iOS/Android বেশিরভাগ ব্রাউজারে কাজ করে
                }
                // fallback: screen.orientation API
                if (screen.orientation) {
                    const type = screen.orientation.type;
                    if (type.includes('portrait')) return 0;
                    if (type.includes('landscape-primary')) return 90;
                    if (type.includes('landscape-secondary')) return -90;
                }
                return 0; // ডিফল্ট
            }

            // রোটেশন আপডেট ফাংশন
            function updateRotation() {
                const angle = getOrientationAngle();
                applyRotation(angle);
            }

            // ইভেন্ট লিসেনার
            window.addEventListener('orientationchange', () => {
                // ওরিয়েন্টেশন চেঞ্জের পর একটু দেরি করে আপডেট (কিছু ডিভাইসে ডিমেনশন সেট হতে সময় নেয়)
                setTimeout(updateRotation, 300);
            });

            // স্ক্রিন রিসাইজ করলেও আপডেট (যেমন ডেস্কটপে উইন্ডো রিসাইজ)
            window.addEventListener('resize', updateRotation);

            // প্রাথমিক রোটেশন সেট করা
            document.addEventListener('DOMContentLoaded', () => {
                // প্লেয়ার লোড হওয়ার পর একটু দেরি করে রোটেশন দিন
                setTimeout(updateRotation, 500);
            });

            // ভিডিও লোড হলে আবার রোটেশন চেক (যাতে মেটাডেটা লোড হওয়ার পরও ঠিক থাকে)
            video.addEventListener('loadedmetadata', updateRotation);

            // ম্যানুয়ালি রোটেশন ফোর্স করতে চাইলে ডেভ টুলসে কল করুন: updateRotation()

            console.log('✅ ভিডিও রোটেশন সক্রিয়। ডিভাইস ঘোরান দেখুন।');
        })();
    </script>
</body>
</html>
