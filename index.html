<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Shaka Player</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}

#player{
  position:fixed;
  inset:0;
  background:#000;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

video.fill{
  object-fit:fill;
}

video.cover{
  object-fit:cover;
}

#error{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  color:#fff;
  background:#080808;
  text-align:center;
  padding:20px;
}

#error h2{
  font-size:18px;
}

#error p{
  color:#aaa;
  font-size:13px;
  max-width:500px;
  word-break:break-word;
}

#loading{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  background:#050505;
  color:#aaa;
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #222;
  border-top-color:#ef4444;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#loading span{
  font-size:13px;
}
</style>
</head>

<body>

<div id="loading">
  <div class="spinner"></div>
  <span>Loading stream...</span>
</div>

<div id="error">
  <h2>Unable to play stream</h2>
  <p id="errorText"></p>
</div>

<div id="player">
  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto">
  </video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){

"use strict";

const video = document.getElementById("video");
const playerContainer = document.getElementById("player");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");
const errorText = document.getElementById("errorText");

function showError(message){
  loading.style.display = "none";
  errorBox.style.display = "flex";
  errorText.textContent = message;
}

function getURL(){

  const params = new URLSearchParams(location.search);

  const url = params.get("url");

  if(!url){
    return null;
  }

  try{
    return decodeURIComponent(url);
  }catch(e){
    return url;
  }
}

async function start(){

  const streamURL = getURL();

  if(!streamURL){
    showError(
      "No stream URL was provided. Use ?url=YOUR_STREAM_URL"
    );
    return;
  }

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){
    showError("This browser does not support Shaka Player.");
    return;
  }

  const player = new shaka.Player();

  try{

    await player.attach(video);

    /*
     * Shaka UI configuration
     */
    new shaka.ui.Overlay(
      player,
      playerContainer,
      video
    ).configure({

      controlPanelElements:[
        "play_pause",
        "mute",
        "volume",
        "time_and_duration",
        "spacer",
        "quality",
        "fullscreen",
        "overflow_menu"
      ],

      overflowMenuButtons:[
        "quality",
        "picture_in_picture",
        "loop",
        "playback_rate"
      ],

      seekBarColors:{
        base:"#777",
        buffered:"#7f1d1d",
        played:"#ef4444"
      }

    });

    /*
     * Streaming configuration
     */
    player.configure({

      streaming:{
        bufferingGoal:10,
        rebufferingGoal:2,
        bufferBehind:30,
        lowLatencyMode:false,

        retryParameters:{
          maxAttempts:5,
          baseDelay:500,
          backoffFactor:2,
          fuzzFactor:.5,
          timeout:30000
        }
      },

      manifest:{
        retryParameters:{
          maxAttempts:5,
          baseDelay:500,
          backoffFactor:2,
          fuzzFactor:.5,
          timeout:30000
        }
      },

      abr:{
        enabled:true,
        defaultBandwidthEstimate:2000000,
        switchInterval:4
      }

    });

    /*
     * Load stream
     */
    await player.load(streamURL);

    loading.style.display = "none";

    /*
     * Try autoplay.
     */
    video.play().catch(function(){
      // Browser may require user interaction.
    });

    /*
     * Error handling
     */
    player.addEventListener("error",function(event){

      const error = event.detail;

      console.error("Shaka error:",error);

    });

    /*
     * Video errors
     */
    video.addEventListener("error",function(){

      if(video.error){

        showError(
          "Video error: " +
          video.error.code
        );

      }

    });

  }catch(error){

    console.error(error);

    showError(
      "Stream could not be loaded: " +
      (error.message || "Unknown error")
    );

  }

}

document.addEventListener(
  "DOMContentLoaded",
  start
);

})();
</script>

</body>
</html>
