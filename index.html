<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RS Player Pro</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.js"></script>

<style>
:root{
 --bg-1:#0a0a12;
 --bg-2:#14101f;
 --grad-a:#22d3ee;
 --grad-b:#a78bfa;
 --grad-c:#fb923c;
 --warn:#ffb84d;
 --alert:#ff5d5d;
 --text:#eef0f7;
 --text-dim:#7a7a92;
 --font:'Poppins','Segoe UI',sans-serif;
 --mono:'JetBrains Mono','Courier New',monospace;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

html,body{
 width:100%;
 height:100%;
 background:#000;
 overflow:hidden;
 font-family:var(--font);
 position:fixed;
 inset:0;
 overscroll-behavior:none;
}

body{touch-action:pan-x pan-y}

/* PLAYER AREA - FULL SCREEN */

#player-wrapper{
 position:fixed;
 top:0;
 left:0;
 right:0;
 bottom:0;
 width:100%;
 overflow:hidden;
 background:#000;
 contain:layout paint;
}

#video-container{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 background:#000;
 overflow:hidden;
}

#video{
 width:100%!important;
 height:100%!important;
 object-fit:fill!important;
 background:#000;
 touch-action:manipulation;
 -webkit-user-select:none;
 user-select:none;
}

.shaka-video-container{
 width:100%!important;
 height:100%!important;
}

.shaka-controls-container{z-index:20!important}
.shaka-controls-container button{touch-action:manipulation}
.shaka-range-container input{accent-color:var(--grad-b)}
.shaka-bottom-controls{padding-bottom:5px!important}

#player-wrapper.native-mode .shaka-controls-container{
 display:none!important;
}

/* LOADER */

#loader{
 position:absolute;
 inset:0;
 background:radial-gradient(80% 60% at 50% 40%,var(--bg-2) 0%,var(--bg-1) 70%);
 display:flex;
 justify-content:center;
 align-items:center;
 flex-direction:column;
 z-index:99;
 transition:opacity .1s ease,visibility .1s ease;
 pointer-events:none;
}

#loader.hide-now{
 opacity:0!important;
 visibility:hidden!important;
 pointer-events:none!important;
}

.tuner{
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:20px;
}

.tv-wrap{
 position:relative;
 width:78px;
 height:78px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.tv-glow{
 position:absolute;
 width:100%;
 height:100%;
 border-radius:50%;
 background:radial-gradient(circle,rgba(167,139,250,.35),transparent 70%);
 animation:glow-pulse 2.4s ease-in-out infinite;
}

@keyframes glow-pulse{
 0%,100%{transform:scale(.85);opacity:.5}
 50%{transform:scale(1.15);opacity:1}
}

.tv-icon{position:relative;width:60px;height:60px}
.tv-icon .tv-body{
 fill:none;
 stroke:var(--text);
 stroke-width:2;
 stroke-linecap:round;
 stroke-linejoin:round;
}

.tv-icon .screen-bars rect{
 transform-origin:bottom;
 animation:bar-flicker 1.6s ease-in-out infinite;
}

.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}
.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}
.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}
.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}
.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}

@keyframes bar-flicker{
 0%,100%{transform:scaleY(.45);opacity:.65}
 50%{transform:scaleY(1);opacity:1}
}

.brand-name{
 font-size:15px;
 font-weight:700;
 letter-spacing:1px;
 text-transform:uppercase;
 background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
 -webkit-background-clip:text;
 background-clip:text;
 color:transparent;
}

.brand-name b{
 color:var(--text);
 -webkit-text-fill-color:var(--text);
}

.dots{display:flex;gap:6px}
.dots span{
 width:6px;
 height:6px;
 border-radius:50%;
 background:var(--grad-b);
 animation:dot-pulse 1.2s ease-in-out infinite;
}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}

@keyframes dot-pulse{
 0%,80%,100%{transform:scale(.6);opacity:.35}
 40%{transform:scale(1);opacity:1}
}

.status-line{
 font-family:var(--mono);
 font-size:9.5px;
 letter-spacing:2.5px;
 color:var(--text-dim);
 text-transform:uppercase;
}

/* ERROR */

.state-content{
 text-align:center;
 color:var(--text);
 z-index:100;
 padding:0 24px;
 pointer-events:auto;
}

.state-content .glyph{
 font-size:34px;
 color:var(--alert);
 margin-bottom:14px;
}

.state-content .glyph.warn{color:var(--warn)}
.state-content p.title{font-size:13px;letter-spacing:1px;font-weight:600}
.state-content p.sub{
 font-family:var(--mono);
 font-size:10.5px;
 color:var(--text-dim);
 margin-top:8px;
 letter-spacing:.5px;
 max-width:280px;
 overflow-wrap:anywhere;
}

.state-content .brand-name{display:block;margin-top:18px}

.retry-btn{
 margin-top:16px;
 padding:8px 20px;
 font-family:var(--font);
 font-weight:600;
 font-size:11px;
 color:#0a0a12;
 background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
 border:none;
 border-radius:18px;
 cursor:pointer;
}

/* FULLSCREEN */

#player-wrapper:fullscreen,
#player-wrapper:-webkit-full-screen{
 position:fixed;
 inset:0;
 width:100vw;
 height:100vh;
 background:#000;
}

#player-wrapper:fullscreen #video-container,
#player-wrapper:-webkit-full-screen #video-container{
 width:100%;
 height:100%;
}

#player-wrapper:fullscreen #video,
#player-wrapper:-webkit-full-screen #video{
 width:100%!important;
 height:100%!important;
 object-fit:fill!important;
}

#video-container,#video{
 -webkit-user-select:none;
 user-select:none;
}
</style>
</head>

<body>

<div id="player-wrapper">

 <div id="video-container">
  <video id="video" playsinline webkit-playsinline preload="auto"></video>
 </div>

 <div id="loader">
  <div class="tuner">

   <div class="tv-wrap">
    <div class="tv-glow"></div>

    <svg class="tv-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
     <path class="tv-body" d="M22 12 32 20 42 12"/>
     <clipPath id="screenClip">
      <rect x="12" y="20" width="40" height="26" rx="4"/>
     </clipPath>
     <g class="screen-bars" clip-path="url(#screenClip)">
      <rect x="12" y="20" width="8" height="26"/>
      <rect x="20" y="20" width="8" height="26"/>
      <rect x="28" y="20" width="8" height="26"/>
      <rect x="36" y="20" width="8" height="26"/>
      <rect x="44" y="20" width="8" height="26"/>
     </g>
     <rect class="tv-body" x="12" y="20" width="40" height="26" rx="4"/>
     <line class="tv-body" x1="24" y1="46" x2="24" y2="50"/>
     <line class="tv-body" x1="40" y1="46" x2="40" y2="50"/>
     <line class="tv-body" x1="20" y1="50" x2="44" y2="50"/>
    </svg>
   </div>

   <div class="brand-name"><b>RS LIVE</b> TV</div>

   <div class="dots">
    <span></span><span></span><span></span>
   </div>

   <div class="status-line" id="status-line">LOADING</div>
  </div>
 </div>

</div>

<script>
/* STREAM SETTINGS */

const urlParams = new URLSearchParams(window.location.search);
const streamSource = urlParams.get('url');
const forcedType = (urlParams.get('type') || '').toLowerCase();
const startMuted = urlParams.get('mute') === '1';

const wrapper = document.getElementById('player-wrapper');
const videoContainer = document.getElementById('video-container');
const video = document.getElementById('video');
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');

/* LOADER */

const statusMessages = ['LOADING','CONNECTING','BUFFERING'];
let statusIdx = 0;

const statusTimer = setInterval(() => {
 if(loaderEl.classList.contains('hide-now')) return;
 statusIdx = (statusIdx + 1) % statusMessages.length;
 statusEl.textContent = statusMessages[statusIdx];
},1800);

function showLoader(){
 loaderEl.classList.remove('hide-now');
}

function hideLoader(){
 loaderEl.classList.add('hide-now');
}

function showState(html){
 clearInterval(statusTimer);
 loaderEl.innerHTML = html;
 showLoader();
}

function brandBlock(){
 return '<div class="brand-name"><b>RS LIVE</b> TV</div>';
}

/* WAKE LOCK */

let wakeLock = null;
let wakeLockWanted = false;

async function requestWakeLock(){
 wakeLockWanted = true;

 if(!('wakeLock' in navigator)) return;
 if(wakeLock) return;
 if(document.visibilityState !== 'visible') return;

 try{
  wakeLock = await navigator.wakeLock.request('screen');
  wakeLock.addEventListener('release',() => {
   wakeLock = null;
  });
 }catch(e){
  wakeLock = null;
 }
}

async function releaseWakeLock(){
 wakeLockWanted = false;

 if(wakeLock){
  try{await wakeLock.release();}catch(e){}
  wakeLock = null;
 }
}

document.addEventListener('visibilitychange',() => {
 if(document.visibilityState === 'visible' && wakeLockWanted){
  requestWakeLock();
 }
});

/* STREAM TYPE */

function detectType(raw){
 if(forcedType) return forcedType;

 const clean = raw.split('?')[0].split('#')[0].toLowerCase();

 if(clean.endsWith('.m3u8')) return 'hls';
 if(clean.endsWith('.mpd')) return 'dash';
 if(clean.endsWith('.mp4') || clean.endsWith('.mov')) return 'mp4';
 if(clean.endsWith('.webm')) return 'webm';
 if(clean.endsWith('.ogg') || clean.endsWith('.ogv')) return 'ogg';

 if(raw.toLowerCase().includes('.m3u8')) return 'hls';
 if(raw.toLowerCase().includes('.mpd')) return 'dash';

 return null;
}

function isDirectFile(type){
 return ['mp4','webm','ogg'].includes(type);
}

/* NO STREAM URL */

if(!streamSource){

 showState(`
  <div class="state-content">
   <div class="glyph warn">&#9888;</div>
   <p class="title">No stream URL supplied</p>
   <p class="sub">Add ?url=YOUR_STREAM_LINK to this page's address.</p>
   ${brandBlock()}
  </div>
 `);

}else{

 const streamType = detectType(streamSource);

 let player = null;
 let ui = null;
 let retryCount = 0;
 const maxRetries = 6;

 let retryTimer = null;
 let noStreamTimer = null;
 let everPlayed = false;
 let userPaused = false;
 let isRetrying = false;
 let isNative = false;
 let destroyed = false;

 const NO_STREAM_TIMEOUT = 12000;

 video.muted = startMuted;

 function applyVideoStyle(){
  video.style.width = '100%';
  video.style.height = '100%';
  video.style.objectFit = 'fill';
  video.style.touchAction = 'manipulation';
  video.setAttribute('playsinline','');
 }

 function onFirstPlayback(){
  clearTimeout(noStreamTimer);
  hideLoader();

  if(!everPlayed){
   everPlayed = true;
   retryCount = 0;
  }else{
   retryCount = 0;
  }

  requestWakeLock();
 }

 function showNoStreamState(err){
  clearTimeout(retryTimer);
  clearTimeout(noStreamTimer);
  releaseWakeLock();

  const message = err && err.message
   ? String(err.message)
   : 'The source could not be reached.';

  const safeMessage = message.replace(/[&<>"']/g,char => ({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  })[char]);

  showState(`
   <div class="state-content">
    <div class="glyph">&#10060;</div>
    <p class="title">No streaming — this link won't play</p>
    <p class="sub">${safeMessage}</p>
    <button class="retry-btn" onclick="location.reload()">Retry</button>
    ${brandBlock()}
   </div>
  `);
 }

 async function loadStream(){
  if(userPaused || destroyed) return;

  isRetrying = true;
  showLoader();
  statusEl.textContent = 'RECONNECTING';

  try{
   if(isNative){
    video.pause();
    video.src = streamSource;
    video.load();
   }else{
    if(!player) throw new Error('Player is not ready.');
    await player.load(streamSource);
   }

   const result = video.play();
   if(result && result.catch){
    await result.catch(() => {});
   }

   isRetrying = false;
  }catch(error){
   isRetrying = false;
   console.error('[RS Player] reconnect error:',error);

   if(retryCount < maxRetries){
    retryCount++;
    statusEl.textContent = 'RECONNECTING ('+retryCount+'/'+maxRetries+')';

    clearTimeout(retryTimer);
    retryTimer = setTimeout(loadStream,Math.min(1000*retryCount,4000));
   }else{
    showNoStreamState(error);
   }
  }
 }

 function handleFault(error){
  console.error('[RS Player] error:',error);

  if(userPaused || destroyed) return;

  if(retryCount < maxRetries){
   retryCount++;
   clearTimeout(retryTimer);
   showLoader();

   statusEl.textContent = 'RECONNECTING ('+retryCount+'/'+maxRetries+')';

   retryTimer = setTimeout(loadStream,Math.min(1000*retryCount,4000));
  }else{
   showNoStreamState(error);
  }
 }

 /* VIDEO EVENTS */

 video.addEventListener('playing',() => {
  clearTimeout(retryTimer);
  onFirstPlayback();
 });

 video.addEventListener('waiting',() => {
  if(everPlayed){
   statusEl.textContent = 'BUFFERING';
   showLoader();
  }
 });

 video.addEventListener('stalled',() => {
  if(everPlayed){
   statusEl.textContent = 'BUFFERING';
   showLoader();
  }
 });

 video.addEventListener('pause',() => {
  releaseWakeLock();

  if(everPlayed && !isRetrying){
   userPaused = true;
  }
 });

 video.addEventListener('play',() => {
  userPaused = false;
  if(everPlayed) hideLoader();
 });

 video.addEventListener('ended',releaseWakeLock);

 video.addEventListener('error',() => {
  if(!video.error) return;

  handleFault(new Error(
   'Video playback error: '+video.error.message
  ));
 });

 /* PLAYER INITIALIZATION */

 async function initializePlayer(){
  try{
   if(!window.shaka){
    throw new Error('Shaka Player library failed to load.');
   }

   shaka.polyfill.installAll();

   if(!shaka.Player.isBrowserSupported()){
    throw new Error('This browser does not support Shaka Player.');
   }

   /* DIRECT FILE */

   if(isDirectFile(streamType)){
    isNative = true;
    wrapper.classList.add('native-mode');
    video.controls = true;
    video.src = streamSource;
    video.load();

    const result = video.play();
    if(result && result.catch){
     await result.catch(error => {
      console.warn('[RS Player] Autoplay blocked:',error);
     });
    }
    return;
   }

   /* SHAKA */

   player = new shaka.Player();
   await player.attach(video);

   player.configure({
    streaming:{
     bufferingGoal:20,
     rebufferingGoal:2,
     bufferBehind:30,
     retryParameters:{
      maxAttempts:3,
      baseDelay:1000,
      backoffFactor:2,
      fuzzFactor:0.5
     }
    }
   });

   ui = new shaka.ui.Overlay(player,videoContainer,video);

   ui.configure({
    controlPanelElements:[
     'play_pause',
     'time_and_duration',
     'spacer',
     'mute',
     'volume',
     'fullscreen'
    ],
    overflowMenuButtons:[
     'quality',
     'language',
     'captions',
     'playback_rate'
    ]
   });

   video.controls = false;

   player.addEventListener('error',event => {
    console.error('[RS Player] Shaka error:',event.detail);

    handleFault(new Error(
     'Shaka playback error: '+
     (event.detail && event.detail.message
      ? event.detail.message
      : 'Stream error')
    ));
   });

   player.addEventListener('buffering',event => {
    if(event.buffering && everPlayed){
     statusEl.textContent = 'BUFFERING';
     showLoader();
    }
   });

   await player.load(streamSource);
   applyVideoStyle();

   const result = video.play();
   if(result && result.catch){
    await result.catch(error => {
     console.warn('[RS Player] Autoplay blocked:',error);
    });
   }

   console.log('[RS Player] Shaka ready:',streamType || 'auto');

  }catch(error){
   console.error('[RS Player] setup error:',error);
   handleFault(error);
  }
 }

 /* FULLSCREEN + LANDSCAPE */

 async function lockLandscape(){
  try{
   if(screen.orientation &&
      typeof screen.orientation.lock === 'function'){
    await screen.orientation.lock('landscape');
   }
  }catch(error){
   console.log('[RS Player] Landscape lock unavailable:',error);
  }
 }

 function unlockLandscape(){
  try{
   if(screen.orientation &&
      typeof screen.orientation.unlock === 'function'){
    screen.orientation.unlock();
   }
  }catch(e){}
 }

 function checkFullscreen(){
  const fullscreen =
   document.fullscreenElement ||
   document.webkitFullscreenElement;

  if(fullscreen){
   lockLandscape();
  }else{
   unlockLandscape();
  }

  requestAnimationFrame(applyVideoStyle);
 }

 document.addEventListener('fullscreenchange',checkFullscreen);
 document.addEventListener('webkitfullscreenchange',checkFullscreen);

 if(screen.orientation){
  screen.orientation.addEventListener('change',() => {
   if(document.fullscreenElement ||
      document.webkitFullscreenElement){
    requestAnimationFrame(applyVideoStyle);
   }
  });
 }

 /* INITIAL TIMEOUT */

 noStreamTimer = setTimeout(() => {
  if(!everPlayed){
   showNoStreamState(
    new Error('Stream did not start within 12 seconds.')
   );
  }
 },NO_STREAM_TIMEOUT);

 /* TOUCH SAFETY */

 videoContainer.addEventListener('contextmenu',event => {
  event.preventDefault();
 },{passive:false});

 /* VIDEO STYLE OBSERVER */

 const observer = new MutationObserver(applyVideoStyle);

 observer.observe(videoContainer,{
  childList:true,
  subtree:true
 });

 /* START */

 applyVideoStyle();
 initializePlayer();

 /* CLEANUP */

 window.addEventListener('pagehide',() => {
  destroyed = true;

  clearTimeout(retryTimer);
  clearTimeout(noStreamTimer);
  clearInterval(statusTimer);

  releaseWakeLock();

  observer.disconnect();

  if(player){
   try{player.destroy();}catch(e){}
  }
 });
}
</script>

</body>
</html>
