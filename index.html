<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fullscreen Video with Auto-Rotate</title>
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.2/dist/plyr.css" />
    <style>
        /* রিসেট – পুরো স্ক্রিন জুড়ে ভিডিও */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* Plyr কন্টেইনারকে পুরো স্ক্রিন করি */
        .plyr--video {
            width: 100vw !important;
            height: 100vh !important;
        }

        /* ভিডিও এলিমেন্ট – cover + রোটেশন প্রস্তুত */
        #player {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;  /* ফাঁকা জায়গা না রাখে */
            background: #000;
            /* রোটেশন transform-এ প্রয়োগ হবে (জাভাস্ক্রিপ্ট) */
            transform-origin: center center;
            transition: transform 0.25s ease;
        }

        /* Plyr-এর কন্ট্রোল ওভারলে ঠিক রাখতে (জরুরি নয়) */
        .plyr__controls {
            z-index: 10;
        }
    </style>
</head>
<body>

    <video id="player" playsinline muted autoplay controls>
        <source type="application/vnd.apple.mpegurl" src="" />
    </video>

    <!-- Plyr ও HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js">
    </script>

    <script>
        (function() {
            'use strict';

            // ১. URL থেকে ভিডিও সোর্স পড়ি
            const urlParams = new URLSearchParams(window.location.search);
            const videoSrc = urlParams.get('url');
            const video = document.getElementById('player');

            if (videoSrc) {
                video.querySelector('source').src = videoSrc;
                video.load();
            }

            // ২. Plyr ইনিশিয়ালাইজ
            let player;
            document.addEventListener('DOMContentLoaded', function() {
                player = new Plyr(video, {
                    fullscreen: { enabled: true, fallback: true, iosNative: true },
                    controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume',
                        'fullscreen'
                    ]
                });

                // ৩. HLS সাপোর্ট
                if (Hls.isSupported() && videoSrc) {
                    const hls = new Hls();
                    hls.loadSource(videoSrc);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(function() {});
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari native HLS
                    video.src = videoSrc;
                }

                // ৪. প্রাথমিক রোটেশন সেট করি (DOM লোড হওয়ার পর)
                setTimeout(applyCurrentRotation, 400);
            });

            // ---------- রোটেশন ফাংশন ----------
            function applyRotation(angle) {
                if (!video) return;
                // ভিডিও এলিমেন্টে সরাসরি রোটেশন দিচ্ছি – Plyr তা মানিয়ে নেয়
                video.style.transform = 'rotate(' + angle + 'deg)';
                // cover ঠিক রাখতে
                video.style.objectFit = 'cover';
            }

            // বর্তমান ডিভাইস ওরিয়েন্টেশন থেকে অ্যাঙ্গেল বের করি
            function getOrientationAngle() {
                // ১. window.orientation (iOS, পুরনো Android)
                if (typeof window.orientation !== 'undefined') {
                    return window.orientation; // 0, 90, -90, 180
                }
                // ২. screen.orientation API (আধুনিক)
                if (screen.orientation) {
                    var type = screen.orientation.type;
                    if (type.includes('portrait-primary')) return 0;
                    if (type.includes('portrait-secondary')) return 180;
                    if (type.includes('landscape-primary')) return 90;
                    if (type.includes('landscape-secondary')) return -90;
                }
                // ৩. window.innerWidth/Height দিয়ে অনুমান (শেষ উপায়)
                if (window.innerWidth > window.innerHeight) {
                    return 90; // ল্যান্ডস্কেপ
                } else {
                    return 0; // পোর্ট্রেট
                }
                return 0;
            }

            // রোটেশন আপডেট ফাংশন (কল করলেই রিফ্রেশ)
            function applyCurrentRotation() {
                var angle = getOrientationAngle();
                applyRotation(angle);
                console.log('🔄 ভিডিও ঘোরানো হয়েছে: ' + angle + '°');
            }

            // ৫. ইভেন্ট লিসেনার – ওরিয়েন্টেশন পরিবর্তনে
            window.addEventListener('orientationchange', function() {
                // কিছু ডিভাইসে সাইজ সেট হতে সময় লাগে, তাই একটু দেরি
                setTimeout(applyCurrentRotation, 300);
            });

            // ৬. screen.orientation পরিবর্তন (নতুন API)
            if (screen.orientation) {
                screen.orientation.addEventListener('change', function() {
                    setTimeout(applyCurrentRotation, 300);
                });
            }

            // ৭. উইন্ডো রিসাইজ (ডেস্কটপে ডিসপ্লে রোটেট করলেও)
            window.addEventListener('resize', function() {
                applyCurrentRotation();
            });

            // ৮. ভিডিও মেটাডেটা লোড হলে আবার চেক (নিশ্চিত)
            video.addEventListener('loadedmetadata', function() {
                applyCurrentRotation();
            });

            // ৯. ম্যানুয়ালি কল করার জন্য গ্লোবাল ফাংশন (ডিবাগে)
            window.rotateVideo = applyCurrentRotation;

            console.log('✅ অটো-রোটেশন সক্রিয়। ডিভাইস ঘোরান দেখুন।');
        })();
    </script>
</body>
</html>
