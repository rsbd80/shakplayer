<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>RS Live Tv</title>


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">


<style>

/* =====================
   RESET
===================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,
body{

width:100%;
height:100%;

background:#000;

overflow:hidden;

font-family:
Segoe UI,
Roboto,
Arial,
sans-serif;

-webkit-user-select:none;
user-select:none;

}


/* =====================
   PLAYER AREA
===================== */


#player{

position:fixed;

inset:0;

background:#000;

display:flex;

align-items:center;

justify-content:center;

}


video{

width:100%;

height:100%;

background:#000;

object-fit:contain;

}


/* VIDEO MODE */


video.mode-fit{

object-fit:contain;

}


video.mode-fill{

object-fit:fill;

}


video.mode-zoom{

object-fit:cover;

}



/* =====================
   RS LIVE TV LOADING
===================== */


#loading{

position:fixed;

inset:0;

z-index:9999;

background:#050505;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:18px;

}


.rs-logo{

width:65px;

height:65px;

border-radius:50%;

border:4px solid #222;

border-top-color:#ef4444;

animation:
spin 1s linear infinite;

display:flex;

align-items:center;

justify-content:center;

}


.rs-logo span{

font-size:14px;

font-weight:800;

color:#ef4444;

position:absolute;

animation:none;

}



@keyframes spin{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}



#loading h1{

font-size:24px;

font-weight:700;

letter-spacing:1px;

color:#fff;

}


#loading p{

font-size:13px;

color:#777;

letter-spacing:.5px;

}


/* =====================
 ERROR BOX
===================== */


#error{

position:fixed;

inset:0;

z-index:10000;

display:none;

align-items:center;

justify-content:center;

flex-direction:column;

background:#050505;

color:white;

padding:20px;

text-align:center;

}


#error h2{

font-size:20px;

margin-bottom:10px;

}


#error p{

color:#999;

font-size:13px;

line-height:1.5;

}


#retry{

margin-top:20px;

padding:10px 25px;

border:0;

border-radius:8px;

background:#ef4444;

color:#fff;

font-size:14px;

}



/* =====================
 SHAKA COLOR
===================== */


.shaka-controls-container button{

color:#fff!important;

}


.shaka-controls-container
.shaka-play-button{

color:#ef4444!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-played{

background:#ef4444!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-buffered{

background:#7f1d1d!important;

}


.shaka-video-container{

background:#000!important;

}



/* =====================
 FIT BUTTON STYLE
===================== */


.sp-fit-btn{

background:transparent!important;

border:none!important;

color:#fff!important;

height:100%;

min-width:55px;

padding:0 8px!important;

display:flex;

align-items:center;

justify-content:center;

gap:5px;

opacity:.9;

}


.sp-fit-btn svg{

width:20px;

height:20px;

}


.fit-ratio{

font-size:10px;

font-weight:600;

color:#fff;

}



@media(max-width:500px){

.sp-fit-btn{

min-width:45px;

padding:0 5px!important;

}

.fit-ratio{

font-size:9px;

}

}


</style>


</head>


<body>



<!-- =====================
     LOADING SCREEN
===================== -->


<div id="loading">


<div class="rs-logo">

<span>RS</span>

</div>


<h1>
RS Live Tv
</h1>


<p id="loadingText">
Loading Stream...
</p>


</div>




<!-- ERROR -->


<div id="error">


<h2>
RS Live Tv
</h2>


<p id="errorText"></p>


<button id="retry">
Retry
</button>


</div>




<!-- PLAYER -->


<div id="player">


<video

id="video"

playsinline

webkit-playsinline

preload="auto">

</video>


</div>





<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>


<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>



<script>
      "use strict";


/* =====================
   ELEMENTS
===================== */

const video =
document.getElementById("video");

const playerBox =
document.getElementById("player");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");

const errorBox =
document.getElementById("error");

const errorText =
document.getElementById("errorText");


let shakaPlayer = null;

let streamURL = null;


/* =====================
   GET URL
===================== */

function getURL(){

let p =
new URLSearchParams(
location.search
);

return p.get("url");

}



/* =====================
   LOADING
===================== */


function hideLoading(){

loading.style.display="none";

}


function showLoading(t){

loadingText.textContent=t;

loading.style.display="flex";

}



/* =====================
   FIT/FILL/ZOOM ICON
===================== */


const FIT_ICONS={


fit:`

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round">

<rect x="3" y="5"
width="18"
height="14"
rx="2"/>

<path d="M8 8H6v2"/>
<path d="M16 8h2v2"/>

<path d="M8 16H6v-2"/>
<path d="M16 16h2v-2"/>

</svg>

`,



fill:`

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round">


<rect x="3"
y="5"
width="18"
height="14"
rx="2"/>


<path d="M8 5v4H4"/>
<path d="M16 5v4h4"/>

<path d="M8 19v-4H4"/>
<path d="M16 19v-4h4"/>


</svg>

`,



zoom:`

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2"
stroke-linecap="round">


<rect x="3"
y="5"
width="18"
height="14"
rx="2"/>


<path d="M8 9L5 6"/>
<path d="M16 9l3-3"/>

<path d="M8 15l-3 3"/>
<path d="M16 15l3 3"/>


</svg>

`

};



const FIT_MODE=[

{
name:"Fit",
css:"mode-fit",
icon:FIT_ICONS.fit
},

{
name:"Fill",
css:"mode-fill",
icon:FIT_ICONS.fill
},

{
name:"Zoom",
css:"mode-zoom",
icon:FIT_ICONS.zoom
}

];


let fitIndex=0;



/* =====================
 ADD FIT BUTTON
===================== */


function addFitButton(){


const panel =
playerBox.querySelector(
".shaka-controls-button-panel"
);


if(!panel)return;


const fs =
panel.querySelector(
".shaka-fullscreen-button"
);



const btn =
document.createElement(
"button"
);


btn.className=
"sp-fit-btn";


btn.innerHTML=`

<span class="fit-icon">
${FIT_ICONS.fit}
</span>

<span class="fit-ratio">
AUTO
</span>

`;



if(fs){

panel.insertBefore(
btn,
fs
);

}else{

panel.appendChild(btn);

}



function apply(){


let m =
FIT_MODE[fitIndex];


video.classList.remove(

"mode-fit",
"mode-fill",
"mode-zoom"

);


video.classList.add(
m.css
);


btn.querySelector(
".fit-icon"
).innerHTML=m.icon;



btn.title=
m.name;


}



btn.onclick=function(e){

e.stopPropagation();


fitIndex++;


if(fitIndex>=FIT_MODE.length)
fitIndex=0;


apply();


};



apply();


}



/* =====================
 SHAKA START
===================== */


async function startPlayer(url){


showLoading(
"Starting RS Live Tv..."
);



shaka.polyfill.installAll();



if(!shaka.Player.isBrowserSupported()){

throw new Error(
"Browser not supported"
);

}



shakaPlayer =
new shaka.Player();



await shakaPlayer.attach(
video
);



const overlay =
new shaka.ui.Overlay(

shakaPlayer,

playerBox,

video

);



overlay.configure({


controlPanelElements:[


"play_pause",

"mute",

"volume",

"time_and_duration",

"spacer",

"fullscreen",

"overflow_menu"

],



/*
 Quality + PiP এখানে থাকবে
*/

overflowMenuButtons:[

"quality",

"picture_in_picture",

"loop",

"playback_rate"

],



seekBarColors:{

base:"#777",

buffered:"#7f1d1d",

played:"#ef4444"

}



});



setTimeout(

addFitButton,

500

);



/* STREAM SETTINGS */


shakaPlayer.configure({

streaming:{


bufferingGoal:10,

rebufferingGoal:2,

bufferBehind:30,


retryParameters:{

maxAttempts:5,

baseDelay:500,

backoffFactor:2,

timeout:30000

}


},



abr:{


enabled:true,

defaultBandwidthEstimate:2000000


}



});



await shakaPlayer.load(url);



hideLoading();



/*
 Auto Play
*/

video.muted=true;


video.play()
.catch(()=>{});



}



/* =====================
   PART 3 NEXT
===================== */
      /* =====================
   AUTO SOUND UNLOCK
===================== */


let soundEnabled=false;


playerBox.addEventListener(

"pointerdown",

function(){


if(soundEnabled)
return;


soundEnabled=true;


video.muted=false;


video.play()
.catch(()=>{});


},

{once:true}

);



/* =====================
   ERROR HANDLER
===================== */


function showError(msg){


hideLoading();


errorText.textContent =
msg;


errorBox.style.display=
"flex";


}



function hideError(){

errorBox.style.display=
"none";

}



shakaPlayer.addEventListener(

"error",

function(e){


console.log(
"Shaka Error:",
e.detail
);


showError(
"Stream error. Retrying..."
);


setTimeout(

function(){

restartStream();

},

3000

);



}

);




/* =====================
   RECONNECT
===================== */


let retryCount=0;


async function restartStream(){


try{


hideError();


showLoading(
"Reconnecting RS Live Tv..."
);



await shakaPlayer.unload();



await shakaPlayer.load(
streamURL
);



video.muted=true;


video.play()
.catch(()=>{});



retryCount=0;


hideLoading();



}

catch(err){


retryCount++;


if(retryCount<5){


setTimeout(

restartStream,

Math.min(

2000*retryCount,

10000

)

);


}

else{


showError(
"Stream unavailable"
);


}



}



}



/* =====================
   VIDEO EVENTS
===================== */


video.addEventListener(

"playing",

function(){

hideLoading();

}

);



video.addEventListener(

"waiting",

function(){

showLoading(
"Buffering..."
);

}

);



video.addEventListener(

"stalled",

function(){


setTimeout(

function(){

restartStream();

},

4000

);


}

);





/* =====================
   NETWORK CHANGE
===================== */


if(navigator.connection){


navigator.connection.addEventListener(

"change",

function(){


console.log(
"Network changed"
);



if(!video.paused){

restartStream();

}



}

);


}




/* =====================
   RETRY BUTTON
===================== */


document
.getElementById("retry")
.addEventListener(

"click",

function(){


retryCount=0;


restartStream();


}

);





/* =====================
   START APP
===================== */


async function init(){


try{


streamURL =
getURL();



if(!streamURL){


showError(

"URL missing\n\nExample:\n?url=https://example.com/live.m3u8"

);


return;


}



await startPlayer(
streamURL
);



}

catch(err){


console.log(err);


showError(
err.message
);


}



}




document.addEventListener(

"DOMContentLoaded",

init

);



</script>


</body>

</html>
