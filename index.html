<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RS Live TV Player</title>
<style>
html,body{margin:0;height:100%;background:#000}
video{width:100%;height:100%;background:#000;object-fit:contain}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:sans-serif}
</style>
</head>
<body>
<div id="loader">Loading...</div>
<video id="v" controls playsinline autoplay></video>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
const url=new URLSearchParams(location.search).get("url");
const v=document.getElementById("v");
const l=document.getElementById("loader");
if(!url){l.textContent="No ?url= provided";}
else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=url;l.style.display="none";}
else if(window.Hls&&Hls.isSupported()){
 const hls=new Hls(); hls.loadSource(url); hls.attachMedia(v);
 hls.on(Hls.Events.MANIFEST_PARSED,()=>{l.style.display="none";v.play().catch(()=>{});});
 hls.on(Hls.Events.ERROR,()=>l.textContent="Playback error");
}else{l.textContent="HLS not supported";}
</script>
</body></html>
