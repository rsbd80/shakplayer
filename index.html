<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>Rs Live Tv</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;

  font-family:
  "Segoe UI",
  Roboto,
  Helvetica,
  Arial,
  sans-serif;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}


/* =========================
   PLAYER
========================= */

#player{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  background:#000;

  touch-action:manipulation;
}

video{
  width:100%;
  height:100%;

  background:#000;

  object-fit:contain;

  will-change:transform;
}

video.mode-fit{
  object-fit:contain;
}

video.mode-fill{
  object-fit:fill;
}

video.mode-zoom{
  object-fit:cover;
}


/* =========================
   LOADING
   ONLY CIRCLE
========================= */

#loading{
  position:absolute;

  top:50%;
  left:50%;

  width:34px;
  height:34px;

  transform:translate(-50%,-50%);

  z-index:9999;

  pointer-events:none;

  display:none;

  align-items:center;
  justify-content:center;
}

.spinner{
  width:30px;
  height:30px;

  border-radius:50%;

  border:3px solid rgba(255,255,255,.16);

  border-top-color:rgba(255,255,255,.78);

  animation:
  rsSpin .8s linear infinite;
}

@keyframes rsSpin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================
   ERROR
========================= */

#error{
  position:fixed;
  inset:0;

  z-index:10000;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:12px;

  padding:25px;

  background:#080808;

  color:#fff;

  text-align:center;
}

#error h2{
  font-size:18px;
  font-weight:600;
}

#error p{
  max-width:600px;

  color:#999;

  font-size:13px;

  line-height:1.6;

  word-break:break-word;
}

#retry{
  margin-top:8px;

  padding:10px 22px;

  border:0;

  border-radius:7px;

  background:#ef4444;

  color:#fff;

  font-size:13px;

  cursor:pointer;
}


/* =========================
   SHAKA
========================= */

.shaka-video-container{
  background:#000!important;
}

.shaka-controls-container
.shaka-play-button{
  color:#ef4444!important;
}

.shaka-controls-container
.shaka-mute-button{
  color:#ef4444!important;
}

.shaka-controls-container
.shaka-fullscreen-button{
  color:#fff!important;
}

.shaka-controls-container
.shaka-overflow-menu-button{
  color:#fff!important;
}

.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-played{
  background:#ef4444!important;
}

.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-buffered{
  background:#7f1d1d!important;
}


/* =========================
   CUSTOM FIT BUTTON
========================= */

.sp-fit-btn{

  width:52px!important;
  min-width:52px!important;
  max-width:52px!important;

  height:100%!important;

  padding:0!important;
  margin:0!important;

  border:0!important;

  background:transparent!important;

  color:#fff!important;

  display:flex!important;

  align-items:center!important;
  justify-content:center!important;

  gap:4px!important;

  opacity:.85;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;

  transition:
  opacity .15s,
  transform .15s;
}

.sp-fit-btn:hover{
  opacity:1;
}

.sp-fit-btn:active{
  opacity:1;
  transform:scale(.92);
}

.sp-fit-btn:focus{
  outline:none;
}

.sp-fit-btn .fit-icon{

  width:18px;
  height:18px;

  flex:0 0 18px;

  display:flex;

  align-items:center;
  justify-content:center;
}

.sp-fit-btn .fit-icon svg{

  width:18px;
  height:18px;

  display:block;
}

.sp-fit-btn .fit-label{

  width:22px;

  font-size:9px;

  font-weight:600;

  line-height:1;

  text-align:left;

  white-space:nowrap;

  overflow:hidden;
}


/* =========================
   SMALL SCREEN
========================= */

@media(max-width:500px){

  .sp-fit-btn{

    width:44px!important;
    min-width:44px!important;
    max-width:44px!important;

    gap:3px!important;
  }

  .sp-fit-btn .fit-icon{

    width:17px;
    height:17px;

    flex-basis:17px;
  }

  .sp-fit-btn .fit-icon svg{

    width:17px;
    height:17px;
  }

  .sp-fit-btn .fit-label{

    width:18px;

    font-size:8px;
  }

}

</style>
</head>


<body>


<div id="player">

  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto">
  </video>


  <!-- ONLY SPINNER -->

  <div id="loading">
    <div class="spinner"></div>
  </div>

</div>


<div id="error">

  <h2>Unable to play stream</h2>

  <p id="errorText"></p>

  <button id="retry">
    Retry
  </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>


<script>

(function(){

"use strict";


/* =========================
   ELEMENTS
========================= */

const video =
document.getElementById("video");

const playerContainer =
document.getElementById("player");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const errorText =
document.getElementById("errorText");

const retryButton =
document.getElementById("retry");


/* =========================
   VARIABLES
========================= */

let player = null;

let streamURL = null;

let fitIndex = 0;

let reconnecting = false;

let reconnectCount = 0;

let reconnectTimer = null;


/* =========================
   URL
========================= */

function getStreamURL(){

  const params =
  new URLSearchParams(
    window.location.search
  );

  const url =
  params.get("url");

  if(!url){
    return null;
  }

  try{
    return decodeURIComponent(url);
  }
  catch(e){
    return url;
  }

}


/* =========================
   LOADING
========================= */

function showLoading(){

  loading.style.display =
  "flex";

}

function hideLoading(){

  loading.style.display =
  "none";

}


/* =========================
   ERROR
========================= */

function showError(message){

  hideLoading();

  errorText.textContent =
  message;

  errorBox.style.display =
  "flex";

}

function hideError(){

  errorBox.style.display =
  "none";

}


/* =========================
   FORMAT
========================= */

function isM3U8(url){

  return /\.m3u8($|[?#])/i.test(url);

}

function isMPD(url){

  return /\.mpd($|[?#])/i.test(url);

}


/* =========================
   RATIO
========================= */

function getRatio(){

  const w =
  video.videoWidth;

  const h =
  video.videoHeight;

  if(!w || !h){
    return "";
  }

  const r =
  w / h;

  if(Math.abs(r - 16/9) < .03){
    return "16:9";
  }

  if(Math.abs(r - 4/3) < .03){
    return "4:3";
  }

  if(Math.abs(r - 21/9) < .04){
    return "21:9";
  }

  if(Math.abs(r - 1) < .03){
    return "1:1";
  }

  return r.toFixed(2)+":1";

}


/* =========================
   FIT ICONS
========================= */

const ICONS = {

  fit:`

  <svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round">

    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
    <path d="M16 3h3a2 2 0 0 1 2 2v3"/>

    <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
    <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>

  </svg>

  `,


  fill:`

  <svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round">

    <rect
    x="5"
    y="5"
    width="14"
    height="14"
    rx="2"/>

    <path d="M9 5v4H5"/>
    <path d="M15 5v4h4"/>

    <path d="M9 19v-4H5"/>
    <path d="M15 19v-4h4"/>

  </svg>

  `,


  zoom:`

  <svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round">

    <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
    <path d="M16 3h3a2 2 0 0 1 2 2v3"/>

    <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
    <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>

    <path d="m8 8-3-3"/>
    <path d="m16 8 3-3"/>

    <path d="m8 16-3 3"/>
    <path d="m16 16 3 3"/>

  </svg>

  `

};


/* =========================
   FIT MODES
========================= */

const FIT_MODES = [

  {
    name:"Fit",
    css:"mode-fit",
    icon:ICONS.fit
  },

  {
    name:"Fill",
    css:"mode-fill",
    icon:ICONS.fill
  },

  {
    name:"Zoom",
    css:"mode-zoom",
    icon:ICONS.zoom
  }

];


/* =========================
   APPLY FIT
========================= */

function applyFit(button){

  const mode =
  FIT_MODES[fitIndex];

  video.classList.remove(
    "mode-fit",
    "mode-fill",
    "mode-zoom"
  );

  video.classList.add(
    mode.css
  );


  const icon =
  button.querySelector(
    ".fit-icon"
  );

  const label =
  button.querySelector(
    ".fit-label"
  );


  if(icon){
    icon.innerHTML =
    mode.icon;
  }

  if(label){
    label.textContent =
    mode.name;
  }


  button.title =
  mode.name;

}


/* =========================
   ADD FIT BUTTON
========================= */

function addFitButton(){

  const panel =
  playerContainer.querySelector(
    ".shaka-controls-button-panel"
  );

  if(!panel){
    return;
  }


  if(
    panel.querySelector(
      ".sp-fit-btn"
    )
  ){
    return;
  }


  const fullscreen =
  panel.querySelector(
    ".shaka-fullscreen-button"
  );


  const button =
  document.createElement(
    "button"
  );

  button.type =
  "button";

  button.className =
  "sp-fit-btn";

  button.innerHTML = `

    <span class="fit-icon">
      ${ICONS.fit}
    </span>

    <span class="fit-label">
      Fit
    </span>

  `;


  /*
   * Same fixed size.
   *
   * Fit button stays
   * before fullscreen.
   */

  if(fullscreen){

    panel.insertBefore(
      button,
      fullscreen
    );

  }
  else{

    panel.appendChild(
      button
    );

  }


  button.addEventListener(
    "click",
    function(e){

      e.preventDefault();

      e.stopPropagation();


      fitIndex++;

      if(
        fitIndex >=
        FIT_MODES.length
      ){

        fitIndex = 0;

      }

      applyFit(button);

    }
  );


  applyFit(button);

}


/* =========================
   DESTROY
========================= */

async function destroyPlayer(){

  if(player){

    try{
      await player.destroy();
    }
    catch(e){
      console.warn(e);
    }

    player = null;

  }


  video.pause();

  video.removeAttribute("src");

  try{
    video.load();
  }
  catch(e){}

}


/* =========================
   SHAKA PLAYER
========================= */

async function startShaka(url){

  showLoading();


  shaka.polyfill.installAll();


  if(
    !shaka.Player.isBrowserSupported()
  ){

    throw new Error(
      "Browser does not support Shaka Player."
    );

  }


  player =
  new shaka.Player();


  await player.attach(
    video
  );


  /* =========================
     SHAKA UI
  ========================= */

  const overlay =
  new shaka.ui.Overlay(
    player,
    playerContainer,
    video
  );


  overlay.configure({

    /*
     * Keep original order.
     */

    controlPanelElements:[

      "play_pause",

      "mute",

      "volume",

      "time_and_duration",

      "spacer",

      "fullscreen",

      "overflow_menu"

    ],


    /*
     * Quality + PiP stay
     * inside settings.
     */

    overflowMenuButtons:[

      "quality",

      "picture_in_picture",

      "loop",

      "playback_rate"

    ],


    seekBarColors:{

      base:"#777",

      buffered:"#7f1d1d",

      played:"#ef4444"

    }

  });


  /*
   * Add custom Fit button
   * after UI has rendered.
   */

  setTimeout(
    addFitButton,
    300
  );

  setTimeout(
    addFitButton,
    1000
  );


  /* =========================
     AUTO QUALITY
  ========================= */

  player.configure({

    abr:{

      enabled:true,

      /*
       * Auto starts from
       * a reasonable estimate.
       */

      defaultBandwidthEstimate:
      2500000,

      /*
       * Faster adaptation.
       */

      switchInterval:2,

      /*
       * No manual
       * max resolution.
       */

      restrictions:{}

    },


    /* =====================
       FAST PLAYBACK
    ===================== */

    streaming:{

      lowLatencyMode:true,

      bufferingGoal:5,

      rebufferingGoal:1,

      bufferBehind:15,

      safeSeekOffset:3,

      stallEnabled:true,

      stallThreshold:1,

      stallSkip:.2,

      retryParameters:{

        maxAttempts:5,

        baseDelay:300,

        backoffFactor:1.7,

        fuzzFactor:.3,

        timeout:15000

      }

    },


    manifest:{

      ignoreTextStreamFailures:true,

      retryParameters:{

        maxAttempts:5,

        baseDelay:300,

        backoffFactor:1.7,

        fuzzFactor:.3,

        timeout:15000

      }

    }

  });


  /* =========================
     SHAKA ERROR
  ========================= */

  player.addEventListener(
    "error",
    function(event){

      console.error(
        "Shaka error:",
        event.detail
      );

    }
  );


  /* =========================
     LOAD
  ========================= */

  await player.load(
    url
  );


  hideLoading();


  /*
   * Autoplay.
   */

  try{

    await video.play();

  }
  catch(e){

    /*
     * Browser autoplay
     * policy may block sound.
     */

    video.muted = true;

    try{
      await video.play();
    }
    catch(_){}

  }

}


/* =========================
   NATIVE HLS
========================= */

async function startNativeHLS(url){

  showLoading();


  video.controls =
  false;


  video.src =
  url;


  return new Promise(
    function(resolve,reject){

      function loaded(){

        hideLoading();

        video.play().catch(
          function(){}
        );

        resolve();

      }


      function failed(){

        reject(
          new Error(
            "Native HLS playback failed."
          )
        );

      }


      video.addEventListener(
        "loadedmetadata",
        loaded,
        {once:true}
      );


      video.addEventListener(
        "error",
        failed,
        {once:true}
      );

    }
  );

}


/* =========================
   PLAY STREAM
========================= */

async function playStream(url){

  await destroyPlayer();


  /*
   * M3U8
   */

  if(isM3U8(url)){

    try{

      await startShaka(url);

      return;

    }
    catch(error){

      console.warn(
        "Shaka HLS failed:",
        error
      );


      await destroyPlayer();


      /*
       * Native fallback
       * only if browser supports it.
       */

      if(
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ){

        try{

          await startNativeHLS(
            url
          );

          return;

        }
        catch(nativeError){

          console.warn(
            nativeError
          );

        }

      }


      throw new Error(
        "M3U8 playback failed."
      );

    }

  }


  /*
   * MPD
   */

  if(isMPD(url)){

    await startShaka(url);

    return;

  }


  /*
   * Other formats
   */

  await startShaka(url);

}


/* =========================
   RECONNECT
========================= */

async function reconnect(){

  if(
    reconnecting ||
    !streamURL
  ){
    return;
  }


  if(
    reconnectCount >= 5
  ){

    showError(
      "Stream unavailable."
    );

    return;

  }


  reconnecting =
  true;

  reconnectCount++;


  showLoading();


  try{

    await playStream(
      streamURL
    );


    reconnectCount =
    0;

    reconnecting =
    false;

    hideLoading();

  }
  catch(error){

    console.warn(
      "Reconnect failed:",
      error
    );


    reconnecting =
    false;


    reconnectTimer =
    setTimeout(
      reconnect,
      Math.min(
        1000 *
        Math.pow(
          2,
          reconnectCount - 1
        ),
        8000
      )
    );

  }

}


/* =========================
   START
========================= */

async function startPlayer(){

  hideError();


  const url =
  getStreamURL();


  if(!url){

    showError(
      "No stream URL was provided."
    );

    return;

  }


  streamURL =
  url;


  try{

    showLoading();

    await playStream(url);

    hideLoading();

  }
  catch(error){

    console.error(
      "Playback error:",
      error
    );


    showError(
      error.message ||
      "Unable to play stream."
    );

  }

}


/* =========================
   VIDEO EVENTS
========================= */

video.addEventListener(
  "playing",
  function(){

    hideLoading();

    reconnectCount =
    0;

  }
);


video.addEventListener(
  "waiting",
  function(){

    /*
     * Show only the circle.
     */

    showLoading();

  }
);


video.addEventListener(
  "stalled",
  function(){

    showLoading();

    if(!reconnecting){

      setTimeout(
        function(){

          if(
            video.readyState < 3 &&
            !reconnecting
          ){

            reconnect();

          }

        },
        5000
      );

    }

  }
);


video.addEventListener(
  "canplay",
  function(){

    if(!video.paused){

      hideLoading();

    }

  }
);


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      setTimeout(
        function(){

          if(
            video.paused &&
            streamURL
          ){

            video.play().catch(
              function(){}
            );

          }

        },
        400
      );

    }

  }
);


/* =========================
   RETRY
========================= */

retryButton.addEventListener(
  "click",
  function(){

    reconnectCount =
    0;

    reconnecting =
    false;

    if(reconnectTimer){

      clearTimeout(
        reconnectTimer
      );

      reconnectTimer =
      null;

    }

    startPlayer();

  }
);


/* =========================
   NETWORK CHANGE
========================= */

if(navigator.connection){

  navigator.connection.addEventListener(
    "change",
    function(){

      /*
       * Keep ABR automatic.
       * Shaka will adapt quality.
       */

      if(player){

        try{

          player.configure(
            "abr.enabled",
            true
          );

        }
        catch(e){}

      }

    }
  );

}


/* =========================
   INIT
========================= */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    startPlayer
  );

}
else{

  startPlayer();

}

})();

</script>

</body>
</html>
