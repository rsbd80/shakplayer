<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>RS Live Tv</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}


/* =========================
   PLAYER
========================= */

#player{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
}

video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
  object-fit:contain;
}


/* =========================
   FIT MODES
========================= */

video.mode-fit{
  object-fit:contain;
}

video.mode-fill{
  object-fit:fill;
}

video.mode-zoom{
  object-fit:cover;
}


/* =========================
   LOADING
========================= */

#loading{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:8px;

  background:rgba(0,0,0,.28);

  pointer-events:none;

  transition:opacity .2s ease;
}

#loading.hidden{
  opacity:0;
  visibility:hidden;
}

.loader{
  width:24px;
  height:24px;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.15);
  border-top-color:#ef4444;

  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading-title{
  color:#fff;
  font-size:15px;
  font-weight:600;
  letter-spacing:.3px;
}

.loading-text{
  color:rgba(255,255,255,.58);
  font-size:11px;
}


/* =========================
   ERROR
========================= */

#error{
  position:fixed;
  inset:0;
  z-index:10000;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  gap:12px;

  padding:24px;

  background:#050505;

  color:#fff;

  text-align:center;
}

#error h2{
  font-size:17px;
  font-weight:600;
}

#error p{
  max-width:500px;
  color:#888;
  font-size:12px;
  line-height:1.6;
  word-break:break-word;
}

#retry{
  margin-top:5px;

  border:0;
  border-radius:7px;

  padding:9px 22px;

  background:#ef4444;
  color:#fff;

  font-size:12px;
  font-weight:600;

  cursor:pointer;
}


/* =========================
   SHAKA
========================= */

.shaka-video-container{
  background:#000!important;
}

.shaka-controls-container button{
  color:#fff!important;
}

.shaka-controls-container
.shaka-play-button{
  color:#ef4444!important;
}

.shaka-controls-container
.shaka-mute-button{
  color:#ef4444!important;
}

.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-played{
  background:#ef4444!important;
}

.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-buffered{
  background:#7f1d1d!important;
}


/* =========================
   CUSTOM FIT BUTTON
========================= */

.rs-fit-button{
  appearance:none;

  background:transparent!important;
  border:0!important;

  color:#fff!important;

  min-width:42px;
  height:100%;

  padding:0 5px!important;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:3px;

  opacity:.82;

  cursor:pointer;

  transition:
    opacity .15s ease,
    transform .15s ease;

  -webkit-tap-highlight-color:transparent;
}

.rs-fit-button:hover{
  opacity:1;
}

.rs-fit-button:active{
  opacity:1;
  transform:scale(.9);
}

.rs-fit-icon{
  width:18px;
  height:18px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.rs-fit-icon svg{
  width:18px;
  height:18px;
  display:block;
}

.rs-fit-ratio{
  font-size:9px;
  font-weight:600;
  line-height:1;
  color:#fff;
  white-space:nowrap;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .rs-fit-button{
    min-width:38px;
    padding:0 4px!important;
  }

  .rs-fit-icon,
  .rs-fit-icon svg{
    width:17px;
    height:17px;
  }

  .rs-fit-ratio{
    font-size:8px;
  }

}

</style>
</head>


<body>


<!-- =========================
     PLAYER
========================= -->

<div id="player">

  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

</div>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

  <div class="loader"></div>

  <div class="loading-title">
    RS Live Tv
  </div>

  <div class="loading-text"
       id="loadingText">
    Loading stream...
  </div>

</div>


<!-- =========================
     ERROR
========================= -->

<div id="error">

  <h2>RS Live Tv</h2>

  <p id="errorText">
    Unable to play stream.
  </p>

  <button id="retry">
    Retry
  </button>

</div>


<!-- =========================
     SHAKA
========================= -->

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>


<script>

(function(){

"use strict";


/* =========================
   ELEMENTS
========================= */

const video =
  document.getElementById("video");

const playerContainer =
  document.getElementById("player");

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const errorBox =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");

const retryButton =
  document.getElementById("retry");


/* =========================
   VARIABLES
========================= */

let player = null;

let streamURL = null;

let fitIndex = 0;

let reconnectTimer = null;

let reconnecting = false;

let reconnectCount = 0;

let fitButton = null;


/* =========================
   LOADING
========================= */

function showLoading(message){

  loadingText.textContent =
    message || "Loading stream...";

  loading.classList.remove("hidden");

}


function hideLoading(){

  loading.classList.add("hidden");

}


/* =========================
   ERROR
========================= */

function showError(message){

  hideLoading();

  errorText.textContent =
    message || "Unable to play stream.";

  errorBox.style.display = "flex";

}


function hideError(){

  errorBox.style.display = "none";

}


/* =========================
   URL
========================= */

function getStreamURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const url =
    params.get("url");

  if(!url){
    return null;
  }

  try{
    return decodeURIComponent(url);
  }
  catch(e){
    return url;
  }

}


/* =========================
   FORMAT
========================= */

function isM3U8(url){

  return /\.m3u8($|[?#])/i.test(url);

}


function isMPD(url){

  return /\.mpd($|[?#])/i.test(url);

}


/* =========================
   RATIO
========================= */

function getRatio(){

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;

  if(!width || !height){
    return "--";
  }

  const ratio =
    width / height;


  if(Math.abs(ratio - 16/9) < .04){
    return "16:9";
  }


  if(Math.abs(ratio - 4/3) < .04){
    return "4:3";
  }


  if(Math.abs(ratio - 21/9) < .05){
    return "21:9";
  }


  if(Math.abs(ratio - 1) < .03){
    return "1:1";
  }


  return ratio.toFixed(2) + ":1";

}


/* =========================
   FIT ICONS
========================= */

const FIT_ICONS = {


  fit: `
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

      <rect x="6" y="7"
            width="12"
            height="10"
            rx="1"/>

      <path d="M3 7V4h3"/>
      <path d="M21 7V4h-3"/>

      <path d="M3 17v3h3"/>
      <path d="M21 17v3h-3"/>

    </svg>
  `,


  fill: `
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

      <rect x="4" y="5"
            width="16"
            height="14"
            rx="2"/>

      <path d="M4 12h16"/>

    </svg>
  `,


  zoom: `
    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         stroke-linecap="round"
         stroke-linejoin="round">

      <circle cx="10"
              cy="10"
              r="6"/>

      <path d="M14 14l7 7"/>

      <path d="M10 7v6"/>
      <path d="M7 10h6"/>

    </svg>
  `

};


const FIT_MODES = [

  {
    name:"Fit",
    css:"mode-fit",
    icon:FIT_ICONS.fit
  },

  {
    name:"Fill",
    css:"mode-fill",
    icon:FIT_ICONS.fill
  },

  {
    name:"Zoom",
    css:"mode-zoom",
    icon:FIT_ICONS.zoom
  }

];


/* =========================
   APPLY FIT
========================= */

function applyFit(){

  const mode =
    FIT_MODES[fitIndex];


  video.classList.remove(
    "mode-fit",
    "mode-fill",
    "mode-zoom"
  );


  video.classList.add(
    mode.css
  );


  if(!fitButton){
    return;
  }


  const icon =
    fitButton.querySelector(
      ".rs-fit-icon"
    );

  const ratio =
    fitButton.querySelector(
      ".rs-fit-ratio"
    );


  if(icon){
    icon.innerHTML =
      mode.icon;
  }


  if(ratio){
    ratio.textContent =
      getRatio();
  }


  fitButton.title =
    mode.name;

}


/* =========================
   ADD FIT BUTTON
========================= */

function addFitButton(){

  if(fitButton){
    return;
  }


  const panel =
    playerContainer.querySelector(
      ".shaka-controls-button-panel"
    );


  if(!panel){
    return;
  }


  fitButton =
    document.createElement("button");


  fitButton.type =
    "button";

  fitButton.className =
    "rs-fit-button";


  fitButton.innerHTML = `

    <span class="rs-fit-icon">
      ${FIT_ICONS.fit}
    </span>

    <span class="rs-fit-ratio">
      --
    </span>

  `;


  /*
   * Put the button at the end.
   * Fullscreen remains separate.
   */

  panel.appendChild(
    fitButton
  );


  fitButton.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      event.stopPropagation();


      fitIndex++;

      if(
        fitIndex >=
        FIT_MODES.length
      ){
        fitIndex = 0;
      }


      applyFit();

    }
  );


  video.addEventListener(
    "loadedmetadata",
    function(){

      const ratio =
        fitButton.querySelector(
          ".rs-fit-ratio"
        );

      if(ratio){
        ratio.textContent =
          getRatio();
      }

    }
  );


  video.addEventListener(
    "resize",
    function(){

      const ratio =
        fitButton.querySelector(
          ".rs-fit-ratio"
        );

      if(ratio){
        ratio.textContent =
          getRatio();
      }

    }
  );


  applyFit();

}


/* =========================
   DESTROY PLAYER
========================= */

async function destroyPlayer(){

  if(player){

    try{
      await player.destroy();
    }
    catch(e){
      console.log(
        "Destroy:",
        e
      );
    }

    player = null;
  }


  video.pause();

  video.removeAttribute("src");

  try{
    video.load();
  }
  catch(e){}


  fitButton = null;

}


/* =========================
   START SHAKA
========================= */

async function startShaka(url){

  showLoading(
    "Loading stream..."
  );


  shaka.polyfill.installAll();


  if(
    !shaka.Player.isBrowserSupported()
  ){

    throw new Error(
      "Browser is not supported."
    );

  }


  player =
    new shaka.Player();


  await player.attach(
    video
  );


  /*
   * Shaka error listener
   */

  player.addEventListener(
    "error",
    function(event){

      console.log(
        "Shaka error:",
        event.detail
      );

    }
  );


  /*
   * UI
   */

  const overlay =
    new shaka.ui.Overlay(
      player,
      playerContainer,
      video
    );


  overlay.configure({

    controlPanelElements:[

      "play_pause",

      "mute",

      "volume",

      "time_and_duration",

      "spacer",

      "fullscreen",

      "overflow_menu"

    ],


    overflowMenuButtons:[

      "quality",

      "picture_in_picture",

      "playback_rate",

      "loop"

    ],


    seekBarColors:{

      base:"#777",

      buffered:"#7f1d1d",

      played:"#ef4444"

    }

  });


  /*
   * Player config
   */

  player.configure({

    streaming:{

      lowLatencyMode:false,

      bufferingGoal:8,

      rebufferingGoal:2,

      bufferBehind:30,

      safeSeekOffset:4,

      stallEnabled:true,

      stallThreshold:2,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },


    manifest:{

      ignoreTextStreamFailures:true,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },


    abr:{

      enabled:true,

      defaultBandwidthEstimate:2000000,

      switchInterval:4

    }

  });


  /*
   * Load stream
   */

  await player.load(url);


  /*
   * Add custom button only
   * after stream/UI is ready.
   */

  setTimeout(
    addFitButton,
    300
  );


  /*
   * Fast autoplay
   */

  video.muted = true;

  try{
    await video.play();
  }
  catch(e){
    console.log(
      "Autoplay:",
      e
    );
  }


  hideLoading();

}


/* =========================
   PLAY STREAM
========================= */

async function playStream(url){

  await destroyPlayer();

  showLoading(
    "Connecting..."
  );


  await startShaka(url);

}


/* =========================
   RECONNECT
========================= */

async function reconnect(){

  if(reconnecting){
    return;
  }


  if(!streamURL){
    return;
  }


  if(reconnectCount >= 5){

    showError(
      "Stream unavailable after several retries."
    );

    return;
  }


  reconnecting = true;

  reconnectCount++;


  showLoading(
    "Reconnecting " +
    reconnectCount +
    "/5..."
  );


  try{

    await playStream(
      streamURL
    );


    reconnectCount = 0;


  }
  catch(e){

    console.log(
      "Reconnect error:",
      e
    );


    if(reconnectTimer){
      clearTimeout(
        reconnectTimer
      );
    }


    reconnectTimer =
      setTimeout(
        function(){

          reconnecting = false;

          reconnect();

        },
        Math.min(
          1500 *
          Math.pow(
            2,
            reconnectCount - 1
          ),
          8000
        )
      );


    return;
  }


  reconnecting = false;

}


/* =========================
   AUTOPLAY SOUND
========================= */

let soundUnlocked = false;


function unlockSound(){

  if(soundUnlocked){
    return;
  }


  soundUnlocked = true;


  video.muted = false;


  video.play().catch(
    function(){}
  );

}


playerContainer.addEventListener(
  "pointerdown",
  unlockSound,
  {
    passive:true
  }
);


playerContainer.addEventListener(
  "touchstart",
  unlockSound,
  {
    passive:true,
    once:true
  }
);


/* =========================
   VIDEO EVENTS
========================= */

video.addEventListener(
  "playing",
  function(){

    hideLoading();

    reconnectCount = 0;

  }
);


video.addEventListener(
  "waiting",
  function(){

    showLoading(
      "Buffering..."
    );

  }
);


video.addEventListener(
  "stalled",
  function(){

    setTimeout(
      function(){

        if(
          video.readyState < 3 &&
          !reconnecting
        ){

          reconnect();

        }

      },
      5000
    );

  }
);


video.addEventListener(
  "error",
  function(){

    if(!reconnecting){
      reconnect();
    }

  }
);


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      setTimeout(
        function(){

          if(
            video.paused &&
            streamURL &&
            !reconnecting
          ){

            video.play().catch(
              function(){}
            );

          }

        },
        400
      );

    }

  }
);


/* =========================
   RETRY
========================= */

retryButton.addEventListener(
  "click",
  async function(){

    reconnectCount = 0;

    reconnecting = false;

    hideError();


    if(streamURL){

      try{

        await playStream(
          streamURL
        );

      }
      catch(e){

        showError(
          e.message ||
          "Unable to play stream."
        );

      }

    }

  }
);


/* =========================
   INIT
========================= */

async function init(){

  const url =
    getStreamURL();


  if(!url){

    showError(
      "No stream URL provided."
    );

    return;

  }


  streamURL = url;


  try{

    await playStream(
      url
    );

  }
  catch(e){

    console.log(
      "Playback error:",
      e
    );


    showError(
      e.message ||
      "Unable to play stream."
    );

  }

}


if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    init,
    {once:true}
  );

}
else{

  init();

}


})();
</script>

</body>
</html>
