<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>RS Live Tv</title>


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">


<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
}


html,
body{

width:100%;
height:100%;

background:#000;

overflow:hidden;

font-family:
Segoe UI,
Roboto,
Arial,
sans-serif;

-webkit-user-select:none;
user-select:none;

}


/* PLAYER */

#player{

position:fixed;

inset:0;

background:#000;

}


video{

width:100%;

height:100%;

background:#000;

object-fit:contain;

}



/* FIT MODES */

video.mode-fit{

object-fit:contain;

}


video.mode-fill{

object-fit:fill;

}


video.mode-zoom{

object-fit:cover;

}



/* =====================
   LIGHT LOADING
===================== */


#loading{

position:fixed;

inset:0;

z-index:9999;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:12px;

background:rgba(0,0,0,.35);

backdrop-filter:blur(2px);

}


.spinner{

width:26px;

height:26px;

border-radius:50%;

border:2px solid rgba(255,255,255,.18);

border-top-color:#ef4444;

animation:spin .8s linear infinite;

}



@keyframes spin{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}



#loadingTitle{

font-size:18px;

font-weight:700;

letter-spacing:.5px;

color:#fff;

}


#loadingText{

font-size:12px;

color:#ddd;

}



/* ERROR */

#error{

display:none;

position:fixed;

inset:0;

z-index:10000;

background:#000;

color:#fff;

align-items:center;

justify-content:center;

flex-direction:column;

gap:15px;

text-align:center;

padding:20px;

}


#error p{

font-size:13px;

color:#aaa;

}


#retry{

padding:10px 25px;

border:0;

border-radius:8px;

background:#ef4444;

color:#fff;

}



/* SHAKA COLOR */


.shaka-controls-container button{

color:#fff!important;

}


.shaka-controls-container
.shaka-play-button{

color:#ef4444!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-played{

background:#ef4444!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-buffered{

background:#7f1d1d!important;

}


.shaka-video-container{

background:#000!important;

}



/* FIT BUTTON */

.sp-fit-btn{

background:transparent!important;

border:none!important;

color:white!important;

height:100%;

min-width:45px;

padding:0 6px!important;

display:flex;

align-items:center;

justify-content:center;

gap:4px;

opacity:.9;

}


.sp-fit-btn svg{

width:18px;

height:18px;

}


.fit-ratio{

font-size:9px;

font-weight:600;

}



/* MOBILE */

@media(max-width:500px){

.sp-fit-btn{

min-width:40px;

}

}


</style>

</head>



<body>


<!-- LOADING -->

<div id="loading">


<div class="spinner"></div>


<div id="loadingTitle">
RS Live Tv
</div>


<div id="loadingText">
Loading stream...
</div>


</div>



<!-- ERROR -->

<div id="error">


<h3>
RS Live Tv
</h3>


<p id="errorText"></p>


<button id="retry">
Retry
</button>


</div>




<!-- PLAYER -->


<div id="player">


<video

id="video"

playsinline

webkit-playsinline

preload="auto">

</video>


</div>




<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>


<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>



<script>
      "use strict";


const video =
document.getElementById("video");

const playerBox =
document.getElementById("player");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");

const errorBox =
document.getElementById("error");

const errorText =
document.getElementById("errorText");

const retry =
document.getElementById("retry");


let player=null;

let streamURL=null;

let fitIndex=0;



function showLoading(t){

loadingText.textContent=t;

loading.style.display="flex";

}



function hideLoading(){

loading.style.display="none";

}



function showError(t){

errorText.textContent=t;

errorBox.style.display="flex";

hideLoading();

}



function hideError(){

errorBox.style.display="none";

}



function getURL(){

let url =
new URLSearchParams(
location.search
).get("url");


return url ? decodeURIComponent(url):null;

}



/* =====================
   NEW FIT ICONS
===================== */


const FIT_ICONS={


fit:`

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<rect x="6" y="7"
width="12"
height="10"
rx="1"/>

<path d="M3 7V4h3"/>
<path d="M21 7V4h-3"/>

<path d="M3 17v3h3"/>
<path d="M21 17v3h-3"/>

</svg>

`,



fill:`

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<rect x="4"
y="5"
width="16"
height="14"
rx="2"/>

<path d="M4 12h16"/>

</svg>

`,



zoom:`

<svg viewBox="0 0 24 24"
fill="none"
stroke="currentColor"
stroke-width="2">

<circle cx="10"
cy="10"
r="6"/>

<path d="M14 14l7 7"/>

<path d="M10 7v6"/>
<path d="M7 10h6"/>

</svg>

`

};



const FIT_MODE=[

{
name:"Fit",
class:"mode-fit",
icon:FIT_ICONS.fit
},

{
name:"Fill",
class:"mode-fill",
icon:FIT_ICONS.fill
},

{
name:"Zoom",
class:"mode-zoom",
icon:FIT_ICONS.zoom
}

];



function ratio(){

if(!video.videoWidth)
return "--";


let r =
video.videoWidth/video.videoHeight;


if(Math.abs(r-16/9)<.05)
return "16:9";


if(Math.abs(r-4/3)<.05)
return "4:3";


return r.toFixed(2);

}





function addFitButton(){


let panel =
playerBox.querySelector(
".shaka-controls-button-panel"
);


if(!panel)return;



let btn =
document.createElement(
"button"
);


btn.className=
"sp-fit-btn";


btn.innerHTML=`

<span class="fit-icon">
${FIT_ICONS.fit}
</span>

<span class="fit-ratio">
--
</span>

`;



panel.appendChild(btn);



btn.onclick=function(e){

e.stopPropagation();


fitIndex++;


if(fitIndex>=FIT_MODE.length)
fitIndex=0;



let m =
FIT_MODE[fitIndex];


video.classList.remove(

"mode-fit",
"mode-fill",
"mode-zoom"

);



video.classList.add(
m.class
);



btn.querySelector(
".fit-icon"
).innerHTML=m.icon;



btn.querySelector(
".fit-ratio"
).textContent=
ratio();


};



video.addEventListener(
"loadedmetadata",
()=>{

btn.querySelector(
".fit-ratio"
).textContent=
ratio();

}

);



}




/* =====================
   START SHAKA
===================== */


async function startShaka(url){


showLoading(
"Starting Player..."
);



shaka.polyfill.installAll();



player =
new shaka.Player();



await player.attach(video);



let overlay =
new shaka.ui.Overlay(

player,

playerBox,

video

);



overlay.configure({


controlPanelElements:[

"play_pause",

"mute",

"volume",

"time_and_duration",

"spacer",

"fullscreen",

"overflow_menu"

],



overflowMenuButtons:[

"quality",

"picture_in_picture",

"playback_rate",

"loop"

]

});



setTimeout(
addFitButton,
500
);




player.configure({

streaming:{


bufferingGoal:8,

rebufferingGoal:2,

bufferBehind:30,


retryParameters:{

maxAttempts:5,

baseDelay:500,

backoffFactor:2,

timeout:30000

}

},


abr:{

enabled:true,

defaultBandwidthEstimate:2000000

}


});



await player.load(url);



/*
 Fast autoplay
*/

video.muted=true;


video.play()
.catch(()=>{});



hideLoading();


      }
      /* =====================
   AUTO SOUND UNLOCK
===================== */


let soundUnlocked=false;


playerBox.addEventListener(
"pointerdown",
function(){

if(soundUnlocked)
return;


soundUnlocked=true;


video.muted=false;


video.play()
.catch(()=>{});


},
{once:true}

);



/* =====================
   STREAM PLAY
===================== */


async function playStream(url){

streamURL=url;


try{

await startShaka(url);


}
catch(e){


console.log(e);


showError(
"Stream load failed"
);


}

}



/* =====================
   AUTO RECONNECT
===================== */


let retryCount=0;

let reconnecting=false;



async function reconnect(){


if(reconnecting)
return;


if(!streamURL)
return;


if(retryCount>=5){


showError(
"Stream unavailable"
);


return;

}



reconnecting=true;


retryCount++;


showLoading(
"Reconnecting... "
+
retryCount
+
"/5"
);



try{


if(player){

await player.unload();

}


await startShaka(
streamURL
);


retryCount=0;



}

catch(e){


setTimeout(

reconnect,

2000

);


}


reconnecting=false;


}





/* =====================
   PLAYER EVENTS
===================== */


video.addEventListener(

"playing",

function(){

hideLoading();

}

);



video.addEventListener(

"waiting",

function(){

showLoading(
"Buffering..."
);

}

);



video.addEventListener(

"stalled",

function(){

setTimeout(

reconnect,

4000

);

}

);



if(player){

player.addEventListener(

"error",

function(e){

console.log(
"Shaka error",
e.detail
);


reconnect();


}

);

}



/* =====================
   VISIBILITY FIX
===================== */


document.addEventListener(

"visibilitychange",

function(){


if(!document.hidden){

setTimeout(

function(){


if(video.paused){

video.play()
.catch(()=>{});

}


},

500

);


}


}

);





/* =====================
   RETRY BUTTON
===================== */


retry.onclick=function(){

retryCount=0;

hideError();


if(streamURL){

playStream(
streamURL
);

}


};





/* =====================
   START APP
===================== */


async function init(){


let url=getURL();



if(!url){

showError(
"No URL found\n\nExample:\n?url=https://example.com/live.m3u8"
);


return;

}



await playStream(url);


}



document.addEventListener(

"DOMContentLoaded",

init

);



})();
</script>


</body>

</html>
