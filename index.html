<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>RS Live Tv</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">


<style>

/* ========================================
   RESET
======================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  font-family:
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;

}


/* ========================================
   PLAYER
======================================== */

#player{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  background:#000;

  touch-action:manipulation;

}


video{

  width:100%;
  height:100%;

  display:block;

  background:#000;

  object-fit:contain;

  will-change:transform;

}


/* ========================================
   VIDEO MODES
======================================== */

video.mode-fit{

  object-fit:contain;

}

video.mode-fill{

  object-fit:fill;

}

video.mode-zoom{

  object-fit:cover;

}


/* ========================================
   LIGHT LOADING
======================================== */

#loading{

  position:fixed;

  inset:0;

  z-index:9999;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:8px;

  background:rgba(0,0,0,.24);

  backdrop-filter:blur(1.5px);

  -webkit-backdrop-filter:blur(1.5px);

  pointer-events:none;

  opacity:1;

  visibility:visible;

  transition:
    opacity .2s ease,
    visibility .2s ease;

}


#loading.hidden{

  opacity:0;

  visibility:hidden;

}


.loader{

  width:24px;
  height:24px;

  border-radius:50%;

  border:2px solid
    rgba(255,255,255,.16);

  border-top-color:#ef4444;

  animation:
    rsSpin .75s linear infinite;

}


@keyframes rsSpin{

  to{

    transform:rotate(360deg);

  }

}


.loading-title{

  color:#fff;

  font-size:15px;

  font-weight:600;

  letter-spacing:.4px;

}


.loading-text{

  color:
    rgba(255,255,255,.55);

  font-size:11px;

}


/* ========================================
   ERROR
======================================== */

#error{

  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:12px;

  padding:24px;

  background:#050505;

  color:#fff;

  text-align:center;

}


#error h2{

  font-size:17px;

  font-weight:600;

}


#error p{

  max-width:520px;

  color:#888;

  font-size:12px;

  line-height:1.6;

  word-break:break-word;

}


#retry{

  margin-top:5px;

  padding:9px 22px;

  border:0;

  border-radius:7px;

  background:#ef4444;

  color:#fff;

  font-size:12px;

  font-weight:600;

  cursor:pointer;

}


/* ========================================
   SHAKA
======================================== */

.shaka-video-container{

  background:#000!important;

}


.shaka-controls-container button{

  color:#fff!important;

}


.shaka-controls-container
.shaka-play-button{

  color:#ef4444!important;

}


.shaka-controls-container
.shaka-mute-button{

  color:#ef4444!important;

}


.shaka-controls-container
.shaka-fullscreen-button{

  color:#fff!important;

}


.shaka-controls-container
.shaka-overflow-menu-button{

  color:#fff!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-played{

  background:#ef4444!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-buffered{

  background:#7f1d1d!important;

}


/* ========================================
   CUSTOM FIT BUTTON
======================================== */

.rs-fit-button{

  appearance:none;

  -webkit-appearance:none;

  background:transparent!important;

  border:0!important;

  color:#fff!important;

  width:48px;

  min-width:48px;

  height:100%;

  padding:0!important;

  margin:0!important;

  display:flex!important;

  align-items:center;

  justify-content:center;

  gap:3px;

  opacity:.85;

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;

  transition:
    opacity .15s ease,
    transform .15s ease;

}


.rs-fit-button:hover{

  opacity:1;

}


.rs-fit-button:active{

  opacity:1;

  transform:scale(.90);

}


.rs-fit-button:focus-visible{

  outline:
    2px solid #ef4444;

  outline-offset:2px;

  border-radius:5px;

}


.rs-fit-icon{

  width:18px;

  height:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-shrink:0;

}


.rs-fit-icon svg{

  width:18px;

  height:18px;

  display:block;

}


.rs-fit-ratio{

  color:#fff;

  font-size:9px;

  font-weight:600;

  line-height:1;

  white-space:nowrap;

}


/* ========================================
   MOBILE
======================================== */

@media(max-width:500px){

  .rs-fit-button{

    display:flex!important;

    width:43px;

    min-width:43px;

    padding:0!important;

    gap:2px;

  }


  .rs-fit-icon,
  .rs-fit-icon svg{

    width:17px;

    height:17px;

  }


  .rs-fit-ratio{

    font-size:8px;

  }

}


/* ========================================
   VERY SMALL SCREEN
======================================== */

@media(max-width:360px){

  .rs-fit-button{

    display:flex!important;

    width:39px;

    min-width:39px;

    gap:1px;

  }


  .rs-fit-icon,
  .rs-fit-icon svg{

    width:16px;

    height:16px;

  }


  .rs-fit-ratio{

    font-size:7px;

  }

}

</style>

</head>


<body>


<!-- ======================================
     PLAYER
====================================== -->

<div id="player">

  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto">
  </video>

</div>


<!-- ======================================
     LOADING
====================================== -->

<div id="loading">

  <div class="loader"></div>

  <div class="loading-title">
    RS Live Tv
  </div>

  <div
    class="loading-text"
    id="loadingText">

    Loading stream...

  </div>

</div>


<!-- ======================================
     ERROR
====================================== -->

<div id="error">

  <h2>
    RS Live Tv
  </h2>

  <p id="errorText">
    Unable to play stream.
  </p>

  <button id="retry">
    Retry
  </button>

</div>


<!-- ======================================
     SHAKA PLAYER
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js"></script>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>


<script>

(function(){

"use strict";


/* ========================================
   ELEMENTS
======================================== */

const video =
  document.getElementById("video");


const playerContainer =
  document.getElementById("player");


const loading =
  document.getElementById("loading");


const loadingText =
  document.getElementById("loadingText");


const errorBox =
  document.getElementById("error");


const errorText =
  document.getElementById("errorText");


const retryButton =
  document.getElementById("retry");



/* ========================================
   VARIABLES
======================================== */

let player = null;

let streamURL = null;

let fitIndex = 0;

let fitButton = null;

let reconnecting = false;

let reconnectCount = 0;

let reconnectTimer = null;

let soundUnlocked = false;



/* ========================================
   LOADING
======================================== */

function showLoading(message){

  loadingText.textContent =
    message ||
    "Loading stream...";

  loading.classList.remove(
    "hidden"
  );

}


function hideLoading(){

  loading.classList.add(
    "hidden"
  );

}



/* ========================================
   ERROR
======================================== */

function showError(message){

  hideLoading();

  errorText.textContent =
    message ||
    "Unable to play stream.";

  errorBox.style.display =
    "flex";

}


function hideError(){

  errorBox.style.display =
    "none";

}



/* ========================================
   GET URL
======================================== */

function getStreamURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const url =
    params.get("url");


  if(!url){

    return null;

  }


  try{

    return decodeURIComponent(
      url
    );

  }
  catch(e){

    return url;

  }

}



/* ========================================
   VIDEO RATIO
======================================== */

function getRatio(){

  const w =
    video.videoWidth;


  const h =
    video.videoHeight;


  if(!w || !h){

    return "--";

  }


  const r =
    w / h;


  if(
    Math.abs(r - 16/9) < .04
  ){

    return "16:9";

  }


  if(
    Math.abs(r - 4/3) < .04
  ){

    return "4:3";

  }


  if(
    Math.abs(r - 21/9) < .05
  ){

    return "21:9";

  }


  if(
    Math.abs(r - 1) < .03
  ){

    return "1:1";

  }


  return r.toFixed(2)+":1";

}



/* ========================================
   FIT ICONS
======================================== */

const FIT_ICONS = {


  /*
   * FIT
   * চার কোণ + screen
   */

  fit:`

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">

      <rect
        x="6"
        y="7"
        width="12"
        height="10"
        rx="1"/>

      <path d="M3 7V4h3"/>

      <path d="M21 7V4h-3"/>

      <path d="M3 17v3h3"/>

      <path d="M21 17v3h-3"/>

    </svg>

  `,


  /*
   * FILL
   * পুরো frame
   */

  fill:`

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">

      <rect
        x="4"
        y="5"
        width="16"
        height="14"
        rx="2"/>

      <path d="M4 12h16"/>

    </svg>

  `,


  /*
   * ZOOM
   * Magnifier
   */

  zoom:`

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">

      <circle
        cx="10"
        cy="10"
        r="6"/>

      <path d="M14 14l7 7"/>

      <path d="M10 7v6"/>

      <path d="M7 10h6"/>

    </svg>

  `

};



/* ========================================
   FIT MODES
======================================== */

const FIT_MODES = [

  {
    name:"Fit",
    css:"mode-fit",
    icon:FIT_ICONS.fit
  },

  {
    name:"Fill",
    css:"mode-fill",
    icon:FIT_ICONS.fill
  },

  {
    name:"Zoom",
    css:"mode-zoom",
    icon:FIT_ICONS.zoom
  }

];



/* ========================================
   APPLY FIT
======================================== */

function applyFit(){

  const mode =
    FIT_MODES[
      fitIndex
    ];


  video.classList.remove(

    "mode-fit",

    "mode-fill",

    "mode-zoom"

  );


  video.classList.add(
    mode.css
  );


  if(!fitButton){

    return;

  }


  const icon =
    fitButton.querySelector(
      ".rs-fit-icon"
    );


  const ratio =
    fitButton.querySelector(
      ".rs-fit-ratio"
    );


  if(icon){

    icon.innerHTML =
      mode.icon;

  }


  if(ratio){

    ratio.textContent =
      getRatio();

  }


  fitButton.title =
    mode.name;

}



/* ========================================
   ADD FIT BUTTON
======================================== */

function addFitButton(){

  if(fitButton){

    return;

  }


  const panel =
    playerContainer.querySelector(
      ".shaka-controls-button-panel"
    );


  if(!panel){

    return;

  }


  fitButton =
    document.createElement(
      "button"
    );


  fitButton.type =
    "button";


  fitButton.className =
    "rs-fit-button";


  fitButton.title =
    "Fit";


  fitButton.innerHTML = `

    <span class="rs-fit-icon">

      ${FIT_ICONS.fit}

    </span>

    <span class="rs-fit-ratio">

      --

    </span>

  `;


  /*
   * Fullscreen-এর ঠিক আগে
   */

  const fullscreen =
    panel.querySelector(
      ".shaka-fullscreen-button"
    );


  if(fullscreen){

    panel.insertBefore(

      fitButton,

      fullscreen

    );

  }
  else{

    panel.appendChild(
      fitButton
    );

  }


  fitButton.addEventListener(

    "click",

    function(event){

      event.preventDefault();

      event.stopPropagation();


      fitIndex++;


      if(
        fitIndex >=
        FIT_MODES.length
      ){

        fitIndex = 0;

      }


      applyFit();

    }

  );


  function updateRatio(){

    if(!fitButton){

      return;

    }


    const ratio =
      fitButton.querySelector(
        ".rs-fit-ratio"
      );


    if(ratio){

      ratio.textContent =
        getRatio();

    }

  }


  video.addEventListener(
    "loadedmetadata",
    updateRatio
  );


  video.addEventListener(
    "resize",
    updateRatio
  );


  applyFit();

}



/* ========================================
   DESTROY PLAYER
======================================== */

async function destroyPlayer(){

  if(player){

    try{

      await player.destroy();

    }
    catch(e){

      console.log(
        "Destroy error:",
        e
      );

    }


    player = null;

  }


  video.pause();


  video.removeAttribute(
    "src"
  );


  try{

    video.load();

  }
  catch(e){}


  fitButton = null;

}



/* ========================================
   START SHAKA
======================================== */

async function startShaka(url){

  showLoading(
    "Loading stream..."
  );


  shaka.polyfill.installAll();


  if(
    !shaka.Player.isBrowserSupported()
  ){

    throw new Error(
      "This browser is not supported."
    );

  }


  player =
    new shaka.Player();


  await player.attach(
    video
  );


  /*
   * Shaka error
   */

  player.addEventListener(

    "error",

    function(event){

      console.log(
        "Shaka error:",
        event.detail
      );

    }

  );


  /*
   * UI
   */

  const overlay =
    new shaka.ui.Overlay(

      player,

      playerContainer,

      video

    );


  /*
   * মূল সিরিয়াল
   */

  overlay.configure({

    controlPanelElements:[

      "play_pause",

      "mute",

      "volume",

      "time_and_duration",

      "spacer",

      "fullscreen",

      "overflow_menu"

    ],


    /*
     * Settings-এর ভিতরে
     */

    overflowMenuButtons:[

      "quality",

      "picture_in_picture",

      "playback_rate",

      "loop"

    ],


    seekBarColors:{

      base:"#777",

      buffered:"#7f1d1d",

      played:"#ef4444"

    }

  });


  /*
   * Player configuration
   */

  player.configure({

    streaming:{

      lowLatencyMode:false,

      bufferingGoal:8,

      rebufferingGoal:2,

      bufferBehind:30,

      safeSeekOffset:4,

      stallEnabled:true,

      stallThreshold:2,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },


    manifest:{

      ignoreTextStreamFailures:true,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },


    abr:{

      enabled:true,

      defaultBandwidthEstimate:
        2000000,

      switchInterval:4

    }

  });


  /*
   * Load
   */

  await player.load(
    url
  );


  /*
   * Fit button
   */

  setTimeout(

    function(){

      addFitButton();

    },

    300

  );


  /*
   * Fast autoplay
   */

  video.muted = true;


  try{

    await video.play();

  }
  catch(e){

    console.log(
      "Autoplay:",
      e
    );

  }


  hideLoading();

}



/* ========================================
   PLAY STREAM
======================================== */

async function playStream(url){

  await destroyPlayer();


  showLoading(
    "Connecting..."
  );


  await startShaka(
    url
  );

}



/* ========================================
   RECONNECT
======================================== */

async function reconnect(){

  if(reconnecting){

    return;

  }


  if(!streamURL){

    return;

  }


  if(
    reconnectCount >= 5
  ){

    showError(
      "Stream unavailable after several retries."
    );

    return;

  }


  reconnecting = true;

  reconnectCount++;


  showLoading(

    "Reconnecting " +

    reconnectCount +

    "/5..."

  );


  try{

    await playStream(
      streamURL
    );


    reconnectCount = 0;


  }
  catch(e){

    console.log(
      "Reconnect error:",
      e
    );


    if(reconnectTimer){

      clearTimeout(
        reconnectTimer
      );

    }


    reconnectTimer =

      setTimeout(

        function(){

          reconnecting = false;

          reconnect();

        },

        Math.min(

          1500 *
          Math.pow(
            2,
            reconnectCount - 1
          ),

          8000

        )

      );


    return;

  }


  reconnecting = false;

}



/* ========================================
   SOUND UNLOCK
======================================== */

function unlockSound(){

  if(soundUnlocked){

    return;

  }


  soundUnlocked = true;


  video.muted = false;


  video.play().catch(
    function(){}
  );

}


playerContainer.addEventListener(

  "pointerdown",

  unlockSound,

  {
    passive:true
  }

);



/* ========================================
   VIDEO EVENTS
======================================== */

video.addEventListener(

  "playing",

  function(){

    hideLoading();

    reconnectCount = 0;

  }

);


video.addEventListener(

  "waiting",

  function(){

    showLoading(
      "Buffering..."
    );

  }

);


video.addEventListener(

  "stalled",

  function(){

    setTimeout(

      function(){

        if(

          video.readyState < 3 &&

          !reconnecting

        ){

          reconnect();

        }

      },

      5000

    );

  }

);


video.addEventListener(

  "error",

  function(){

    if(!reconnecting){

      reconnect();

    }

  }

);



/* ========================================
   VISIBILITY
======================================== */

document.addEventListener(

  "visibilitychange",

  function(){

    if(!document.hidden){

      setTimeout(

        function(){

          if(

            video.paused &&

            streamURL &&

            !reconnecting

          ){

            video.play().catch(
              function(){}
            );

          }

        },

        400

      );

    }

  }

);



/* ========================================
   RETRY
======================================== */

retryButton.addEventListener(

  "click",

  async function(){

    reconnectCount = 0;

    reconnecting = false;

    hideError();


    if(!streamURL){

      return;

    }


    try{

      await playStream(
        streamURL
      );

    }
    catch(e){

      showError(

        e.message ||

        "Unable to play stream."

      );

    }

  }

);



/* ========================================
   INIT
======================================== */

async function init(){

  const url =
    getStreamURL();


  if(!url){

    showError(
      "No stream URL provided."
    );

    return;

  }


  streamURL = url;


  try{

    await playStream(
      url
    );

  }
  catch(e){

    console.log(
      "Playback error:",
      e
    );


    showError(

      e.message ||

      "Unable to play stream."

    );

  }

}



/* ========================================
   START
======================================== */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(

    "DOMContentLoaded",

    init,

    {once:true}

  );

}
else{

  init();

}


})();
</script>

</body>

</html>
